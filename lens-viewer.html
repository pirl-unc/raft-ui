      if (!data?.results?.length) return <div className="text-xs text-gray-400 italic">No ClinVar entries found</div>;
      const sigColors = {
        'pathogenic': 'bg-red-100 text-red-700',
        'likely pathogenic': 'bg-red-50 text-red-600',
        'uncertain significance': 'bg-yellow-100 text-yellow-700',
        'likely benign': 'bg-green-50 text-green-600',
        'benign': 'bg-green-100 text-green-700',
      };
      return (
        <div>
          <div className="text-xs font-medium text-gray-600 mb-1">ClinVar Annotations</div>
          <div className="space-y-1.5">
            {data.results.slice(0, 3).map((r, i) => (
              <div key={i} className="flex flex-wrap items-center gap-1.5 text-xs">
                <span className={`px-1.5 py-0.5 rounded font-medium ${sigColors[r.clinical_significance?.toLowerCase()] || 'bg-gray-100 text-gray-600'}`}>
                  {r.clinical_significance || 'Unknown'}
                </span>
                {r.accession && <a href={`https://www.ncbi.nlm.nih.gov/clinvar/variation/${r.accession}/`} target="_blank" rel="noopener" className="text-blue-600 hover:underline" onClick={e => e.stopPropagation()}>{r.accession}</a>}
                {r.conditions?.length > 0 && <span className="text-gray-500">{r.conditions.join(', ')}</span>}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // Reference Links Component
    const ReferenceLinks = ({ data }) => {
      if (!data?.links?.length) return null;
      return (
        <div>
          <div className="text-xs font-medium text-gray-600 mb-1">External References</div>
          <div className="flex flex-wrap gap-1.5">
            {data.links.map((link, i) => (
              <a key={i} href={link.url} target="_blank" rel="noopener"
                onClick={e => e.stopPropagation()}
                className="inline-block px-2 py-0.5 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full transition">
                {link.name} <Icon name="external-link" size={10} className="inline ml-0.5" />
              </a>
            ))}
          </div>
        </div>
      );
    };

    // Expanded Card Content — fetches external data and shows source details
    const ExpandedCardContent = ({ row }) => {
      const [hpaData, setHpaData] = useState(null);
      const [clinvarData, setClinvarData] = useState(null);
      const [linksData, setLinksData] = useState(null);
      const [loading, setLoading] = useState(true);

      React.useEffect(() => {
        let cancelled = false;
        const gene = row.cta_gene || row.gene_name || '';
        const source = row.antigen_source || '';

        const fetches = [];

        // HPA for CTA
        if (source === 'CTA' && gene) {
          fetches.push(
            fetch(`/api/external/hpa?gene=${encodeURIComponent(gene)}`)
              .then(r => r.json()).then(d => { if (!cancelled) setHpaData(d); })
              .catch(() => {})
          );
        }

        // ClinVar for SNV/Indel
        if ((source === 'SNV' || source === 'Indel') && gene) {
          const variant = row.protein_change || '';
          fetches.push(
            fetch(`/api/external/clinvar?gene=${encodeURIComponent(gene)}&variant=${encodeURIComponent(variant)}`)
              .then(r => r.json()).then(d => { if (!cancelled) setClinvarData(d); })
              .catch(() => {})
          );
        }

        // Links for all
        if (gene) {
          fetches.push(
            fetch(`/api/external/links?gene=${encodeURIComponent(gene)}&source=${encodeURIComponent(source)}`)
              .then(r => r.json()).then(d => { if (!cancelled) setLinksData(d); })
              .catch(() => {})
          );
        }

        Promise.allSettled(fetches).then(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [row]);

      return (
        <div className="mb-3 p-3 bg-blue-50 rounded-md border border-blue-100 space-y-3" onClick={e => e.stopPropagation()}>
          <div className="text-xs font-semibold text-blue-800 uppercase tracking-wide">Detailed Information</div>
          {loading && <div className="flex items-center gap-2 text-xs text-gray-500"><Icon name="loader-2" size={12} className="animate-spin" /> Loading external data...</div>}
          {hpaData && <HPABarChart tissues={hpaData.tissues} />}
          {clinvarData && <ClinVarSummary data={clinvarData} />}
          {linksData && <ReferenceLinks data={linksData} />}
          {!loading && !hpaData && !clinvarData && !linksData?.links?.length && (
            <div className="text-xs text-gray-400 italic">No external data available for this entry.</div>
          )}
        </div>
      );
    };

    // pMHC Card Component
    const PMHCCard = ({ row, idx, sortMetric, comments, setComments, isSelected, onSelect, hasCustomFormula, tumorType, tumorSubtype }) => {
      const key = `${row.peptide}-${row.allele}`;
      const [expanded, setExpanded] = useState(false);
      const sourceFields = SOURCE_FIELDS[row.antigen_source] || [];
      const antigenSource = (row.antigen_source || '').toLowerCase();
      const isSNV = antigenSource.includes('snv');
      const isIndel = antigenSource.includes('indel');
      const isFusion = antigenSource.includes('fusion');
      const isCTA = antigenSource.includes('cta');
      const snvEvidence = parseJsonField(row.snv_external_evidence);
      const fusionEvidence = parseJsonField(row.fusion_evidence);
      const ctaExpression = parseJsonField(row.cta_hpa_expression);
      const fusionContext = (() => {
        if (!fusionEvidence) return null;
        const tumorData = fusionEvidence[tumorType];
        if (!tumorData) return null;
        const subtypeData = tumorSubtype && tumorData.subtypes ? tumorData.subtypes[tumorSubtype] : null;
        return { tumorData, subtypeData };
      })();

      return (
        <div onClick={onSelect} className={`bg-white rounded-lg p-4 cursor-pointer transition shadow-sm hover:shadow-md ${isSelected ? 'border-2 border-indigo-500 bg-indigo-50' : 'border border-gray-200'}`}>
          <div className="flex justify-between items-start mb-3">
            <div>
              <div className="text-lg font-bold text-gray-800 mb-0.5 font-mono">{row.peptide}</div>
              <div className="text-sm text-gray-500 font-mono">{row.allele} &bull;{' '}
                <span className={`inline-block px-1.5 py-0.5 rounded text-xs font-medium ${
                  row.antigen_source === 'CTA' ? 'bg-purple-100 text-purple-700' :
                  row.antigen_source === 'Fusion' ? 'bg-orange-100 text-orange-700' :
                  row.antigen_source === 'Virus' ? 'bg-red-100 text-red-700' :
                  row.antigen_source === 'ERV' ? 'bg-yellow-100 text-yellow-700' :
                  row.antigen_source === 'Splice' ? 'bg-teal-100 text-teal-700' :
                  'bg-blue-100 text-blue-700'
                }`}>{row.antigen_source}</span>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={(e) => { e.stopPropagation(); setExpanded(!expanded); }}
                className="text-gray-400 hover:text-gray-600 p-1" title={expanded ? 'Collapse' : 'Expand details'}>
                <Icon name={expanded ? 'chevron-up' : 'chevron-down'} size={16} />
              </button>
              <div className="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">#{idx + 1}</div>
            </div>
          </div>

          <div className="mb-3 p-3 bg-gray-50 rounded-md">
            <table className="w-full"><tbody>
              {hasCustomFormula && <MetricDisplay label="Custom Score" value={row.custom_score} highlight />}
              <MetricDisplay label="Priority Score" value={row[sortMetric]} />
              <MetricDisplay label="MHCFlurry Binding Aff" value={row['mhcflurry_2.1.1.aff']} />
              <MetricDisplay label="MHCFlurry Pres Score" value={row['mhcflurry_2.1.1.pres_score']} />
              <MetricDisplay label="CCF" value={row.ccf} />
              <MetricDisplay label="VAF" value={row.vaf} />
              <MetricDisplay label="Log2(TPM)" value={row.tpm} transform={v => { const num = parseFloat(v); return (!isNaN(num) && num > 0) ? Math.log2(num) : null; }} />
              {sourceFields.length > 0 && (
                <tr><td colSpan={2} className="pt-1 pb-0.5">
                  <div className="border-t border-gray-200 mt-1 mb-0.5"></div>
                </td></tr>
              )}
              {sourceFields.map(f => (
                <MetricDisplay key={f.key} label={f.label} value={row[f.key]} isText />
              ))}
            </tbody></table>
          </div>

          {(isSNV || isIndel || isFusion || isCTA) && (
            <div className="grid gap-3 mb-3">
              {(isSNV || isIndel) && (
                <div className="rounded-md border border-gray-200 bg-white p-3">
                  <div className="text-sm font-semibold text-gray-800 mb-1">Genomic Context</div>
                  <div className="text-xs text-gray-600 mb-1">
                    {(row.chromosome || 'chr?') + ':' + (row.start || 'N/A') + '-' + (row.end || 'N/A')} &bull; {(row.ref || '?')}→{(row.alt || '?')}
                  </div>
                  <div className="text-xs text-gray-500">{row.gene_name || 'Unknown gene'} &bull; {row.protein_change || 'N/A'} &bull; {row.variant_type || 'variant'}</div>
                  <div className="mt-2 pt-2 border-t border-dashed border-gray-200 text-xs text-gray-600 space-y-0.5">
                    <div className="font-semibold text-gray-700">External Variant Evidence (Open Sources)</div>
                    {snvEvidence ? (
                      <>
                        <div><span className="font-medium">Sources:</span> {formatList(snvEvidence.sources)}</div>
                        <div><span className="font-medium">Tier:</span> {snvEvidence.tier || 'N/A'}</div>
                        <div><span className="font-medium">Occurrences:</span> {snvEvidence.occurrences || 'N/A'}</div>
                        <div><span className="font-medium">Summary:</span> {snvEvidence.summary || 'N/A'}</div>
                        {snvEvidence.notes && <div><span className="font-medium">Notes:</span> {snvEvidence.notes}</div>}
                      </>
                    ) : (
                      <div>No external evidence provided.</div>
                    )}
                  </div>
                </div>
              )}

              {isFusion && (
                <div className="rounded-md border border-gray-200 bg-white p-3">
                  <div className="text-sm font-semibold text-gray-800 mb-1">Fusion Evidence</div>
                  <div className="text-xs text-gray-600 mb-1">
                    {row.fusion_partner_5 || 'Gene5'} &mdash; {row.fusion_partner_3 || 'Gene3'} &bull; {row.fusion_type || 'fusion'}
                  </div>
                  <div className="text-xs text-gray-500 mb-2">Junction: {row.fusion_junction || 'N/A'} &bull; Support reads: {row.fusion_support_reads || 'N/A'}</div>
                  <div className="text-xs text-gray-600 space-y-0.5">
                    <div><span className="font-medium">Tumor:</span> {tumorType}{tumorSubtype ? ` (${tumorSubtype})` : ''}</div>
                    {fusionContext ? (
                      <>
                        <div><span className="font-medium">Sources:</span> {formatList(fusionContext.tumorData.sources)}</div>
                        <div><span className="font-medium">Samples:</span> {fusionContext.tumorData.samples || 'N/A'}</div>
                        {fusionContext.subtypeData && (
                          <div><span className="font-medium">Subtype samples:</span> {fusionContext.subtypeData.samples || 'N/A'}</div>
                        )}
                        {fusionContext.tumorData.notes && <div><span className="font-medium">Notes:</span> {fusionContext.tumorData.notes}</div>}
                      </>
                    ) : (
                      <div>No fusion evidence available for selected tumor type.</div>
                    )}
                  </div>
                </div>
              )}

              {isCTA && (
                <div className="rounded-md border border-gray-200 bg-white p-3">
                  <div className="text-sm font-semibold text-gray-800 mb-1">CTA Expression (Human Protein Atlas)</div>
                  <div className="text-xs text-gray-600 mb-1">{row.cta_gene || row.gene_name || 'CTA'} &bull; {row.cta_tissue_specificity || 'tissue-specific'}</div>
                  {ctaExpression ? (
                    <div className="text-xs text-gray-600 space-y-0.5">
                      <div><span className="font-medium">Group:</span> {ctaExpression.group || 'N/A'}</div>
                      <div><span className="font-medium">Median TPM:</span> {ctaExpression.median_tpm || 'N/A'}</div>
                      <div><span className="font-medium">TPM Range:</span> {ctaExpression.tpm_range || 'N/A'}</div>
                      <div><span className="font-medium">Enriched Tissues:</span> {formatList(ctaExpression.enriched_tissues)}</div>
                      {ctaExpression.source && <div><span className="font-medium">Source:</span> {ctaExpression.source}</div>}
                    </div>
                  ) : (
                    <div className="text-xs text-gray-600">No CTA expression distribution available.</div>
                  )}
                </div>
              )}
            </div>
          )}

          {expanded && <ExpandedCardContent row={row} />}

          <div>
            <label className="block mb-1 text-xs font-medium text-gray-700">Comments</label>
            <textarea
              value={comments[key] || ''} onChange={(e) => { e.stopPropagation(); setComments({ ...comments, [key]: e.target.value }); }} onClick={(e) => e.stopPropagation()}
              placeholder="Add your notes about this pMHC..."
              className="w-full min-h-14 px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y"
            />
          </div>
        </div>
      );
    };

    // Metric Display Component — renders a table row (key left, value right)
    const MetricDisplay = ({ label, value, highlight, transform, isText }) => {
      const displayValue = (v) => {
        if (v === null || v === undefined || v === '' || v === 'NA') return 'N/A';
        if (isText) return String(v);
        const transformedValue = transform ? transform(v) : parseFloat(v);
        return (transformedValue === null || isNaN(transformedValue)) ? 'N/A' : transformedValue.toFixed(3);
      };
      return (
        <tr className={highlight ? 'bg-indigo-50' : ''}>
          <td className={`pr-3 py-0.5 text-xs uppercase tracking-wide whitespace-nowrap ${highlight ? 'text-indigo-700 font-semibold' : 'text-gray-500'}`}>{label}</td>
          <td className={`py-0.5 text-sm font-semibold ${highlight ? 'text-indigo-900' : 'text-gray-800'}`}>{displayValue(value)}</td>
        </tr>
      );
    };

    // Render
    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<LENSViewer />);
    } catch (error) {
      console.error('Failed to render LENS Viewer:', error);
      document.getElementById('root').innerHTML =
        '<div class="p-8 font-sans max-w-xl">' +
        '<h2 class="text-red-600 text-xl font-bold mb-4">Application Error</h2>' +
        '<p class="mb-2">Failed to initialize the LENS Viewer.</p>' +
        '<pre class="bg-gray-100 p-4 rounded text-xs overflow-auto">' + error.toString() + '</pre>' +
        '<p class="mt-4"><a href="javascript:location.reload()" class="text-blue-600 hover:underline">Click here to retry</a></p>' +
        '</div>';
    }
  </script>
</body>
</html>
