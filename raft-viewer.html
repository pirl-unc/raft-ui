<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAFT Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .icon-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="root">
    <div class="p-8 font-sans">
      <p>Loading RAFT Viewer...</p>
      <p class="text-gray-500 text-sm">If this message persists, check your browser console for errors.</p>
    </div>
  </div>
  <script src="raft-viewer-demo-data.js"></script>
  <script>
    window.__RAFT_VIEWER_BOOT_ERRORS__ = [];

    window.addEventListener('error', function (event) {
      const message = event.error && event.error.stack
        ? event.error.stack
        : [event.message, event.filename, event.lineno, event.colno].filter(Boolean).join(' @ ');
      window.__RAFT_VIEWER_BOOT_ERRORS__.push(message || 'Unknown startup error');
    });

    window.addEventListener('unhandledrejection', function (event) {
      const reason = event.reason;
      const message = reason && reason.stack
        ? reason.stack
        : String(reason || 'Unknown unhandled rejection');
      window.__RAFT_VIEWER_BOOT_ERRORS__.push(message);
    });

    window.__RAFT_VIEWER_SHOW_BOOT_ERRORS__ = function () {
      const root = document.getElementById('root');
      const errors = window.__RAFT_VIEWER_BOOT_ERRORS__ || [];
      if (!root || errors.length === 0) return;
      if (!root.textContent.includes('Loading RAFT Viewer')) return;
      const escaped = errors
        .map(function (msg) {
          return String(msg)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        })
        .join('\n\n');
      root.innerHTML =
        '<div class="p-8 font-sans max-w-4xl">' +
        '<h2 class="text-red-600 text-xl font-bold mb-4">RAFT Viewer Startup Error</h2>' +
        '<p class="mb-4 text-gray-700">The app failed before it could replace the loading screen.</p>' +
        '<pre class="bg-gray-100 p-4 rounded text-xs overflow-auto whitespace-pre-wrap">' + escaped + '</pre>' +
        '</div>';
    };

    window.setTimeout(window.__RAFT_VIEWER_SHOW_BOOT_ERRORS__, 2500);
  </script>
  <script id="raft-viewer-source" type="text/plain">
    const { useState, useMemo, useEffect, useRef } = React;

    // Icon component using Lucide
    const Icon = ({ name, size = 24, color = 'currentColor', className = '' }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && lucide.icons[name]) {
          ref.current.innerHTML = '';
          const svg = lucide.createElement(lucide.icons[name]);
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          svg.setAttribute('stroke', color);
          if (className) svg.setAttribute('class', className);
          ref.current.appendChild(svg);
        }
      }, [name, size, color, className]);
      return <span ref={ref} className="icon" style={{ width: size, height: size }} />;
    };

    // PDF.js worker setup
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // API base for preloading
    const API_BASE = window.location.origin;
    const IS_GITHUB_HOSTED = window.location.hostname.includes('github.io');

    // Module-level QC file URL cache (accessible from all components)
    let _qcFileUrls = {};
    const getQcFileUrl = (path) => {
      if (!path) return '';
      if (_qcFileUrls[path]) return _qcFileUrls[path];
      return `${API_BASE}/api/qc-file?path=${encodeURIComponent(path)}`;
    };
    const getUrlParams = () => {
      const params = new URLSearchParams(window.location.search);
      return {
        preload: params.get('preload') || '',
        preloadQc: params.get('preload_qc') || '',
        projectId: params.get('project_id') || '',
        demo: params.get('demo') || '',
        workflow: params.get('workflow') || '',
        version: params.get('version') || '',
        species: params.get('species') || '',
        input: params.get('input') || ''
      };
    };




    // Priority metrics


    // Config-driven: section-specific fields are loaded from report-ui.json at runtime.
    // DEMO_REPORT_CONFIG provides LENS defaults for demo/GitHub-hosted mode.

    const demoData = window.__RAFT_VIEWER_DEMO__ || {};
    const DEMO_MANIFEST = demoData.DEMO_MANIFEST || {};
    const DEMO_FILES = demoData.DEMO_FILES || [];
    const DEMO_QC_DATA = demoData.DEMO_QC_DATA || {};
    const DEMO_REPORT_CONFIG = demoData.DEMO_REPORT_CONFIG || {};


    const DEFAULT_REPORT_TEMPLATE = {
      schema_version: '1.0',
      name: 'RAFT Results Viewer',
      description: 'Review workflow reports, patient-level results, and QC summaries.',
      bundle_format: 'raft-report-bundle-v1',
      layout: {
        navigation: 'patients',
        group_navigation: true,
        collapsible_sidebar: true
      },
      sections: [
        {
          ...DEMO_REPORT_CONFIG,
          id: 'report',
          label: 'Report',
          renderer: 'report',
          default: true,
        },
        {
          id: 'qc',
          label: 'QC',
          renderer: 'qc_summary',
          source: 'qc'
        }
      ]
    };

    const normalizeReportTemplate = (template) => {
      const base = template && typeof template === 'object' ? template : DEFAULT_REPORT_TEMPLATE;
      const sections = Array.isArray(base.sections)
        ? base.sections.filter(section => section && section.id && section.label)
        : [];
      return {
        ...DEFAULT_REPORT_TEMPLATE,
        ...base,
        layout: { ...DEFAULT_REPORT_TEMPLATE.layout, ...(base.layout || {}) },
        sections: sections.length ? sections : DEFAULT_REPORT_TEMPLATE.sections
      };
    };

    // Main Component
    const BundlePatientSelector = ({ patients, onLoad }) => {
      const [selected, setSelected] = useState(new Set(patients.map(p => p.id)));
      const allIds = patients.map(p => p.id);
      const toggleAll = () => {
        if (selected.size === allIds.length) { setSelected(new Set()); }
        else { setSelected(new Set(allIds)); }
      };
      const toggle = (id) => {
        const next = new Set(selected);
        if (next.has(id)) next.delete(id); else next.add(id);
        setSelected(next);
      };
      const totalMB = (patients.filter(p => selected.has(p.id)).reduce((s, p) => s + p.sizeBytes, 0) / (1024 * 1024)).toFixed(1);
      return (
        <div className="max-w-2xl mx-auto">
          <h2 className="text-2xl font-bold text-gray-800 mb-2">Select Patients to Load</h2>
          <p className="text-gray-600 mb-4">This bundle contains {patients.length} patients. Choose which to load.</p>
          <div className="flex gap-2 mb-4">
            <button onClick={toggleAll} className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition text-sm font-medium cursor-pointer">
              {selected.size === allIds.length ? 'Deselect All' : 'Select All'}
            </button>
            <button onClick={() => selected.size > 0 && onLoad(Array.from(selected))} disabled={selected.size === 0}
              className="px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 transition text-sm font-medium cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
              Load {selected.size} Patient{selected.size !== 1 ? 's' : ''} ({totalMB} MB)
            </button>
          </div>
          <div className="max-h-80 overflow-y-auto border border-gray-200 rounded-lg">
            {patients.map(p => (
              <label key={p.id} className="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-b-0">
                <input type="checkbox" checked={selected.has(p.id)} onChange={() => toggle(p.id)}
                  className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                <span className="font-medium text-gray-800">{p.id}</span>
                <span className="text-sm text-gray-500 ml-auto">{p.files.length} file{p.files.length !== 1 ? 's' : ''} &middot; {(p.sizeBytes / (1024 * 1024)).toFixed(1)} MB</span>
              </label>
            ))}
          </div>
        </div>
      );
    };

    const LENSViewer = () => {
      const [patients, setPatients] = useState({});
      const [selectedPatient, setSelectedPatient] = useState(null);
      const [topN, setTopN] = useState(25);
      const [sortMetric, setSortMetric] = useState(DEFAULT_REPORT_TEMPLATE?.sections?.find(s => s.default || s.renderer === 'report' || s.renderer === 'lens_antigen_report')?.sort_metric || 'priority_score_maximum');
      const [selectedAlleles, setSelectedAlleles] = useState(new Set());
      const [selectedAntigenSources, setSelectedAntigenSources] = useState(new Set());
      const [patientComments, setPatientComments] = useState({});
      const comments = patientComments[selectedPatient] || {};
      const setComments = (newComments) => {
        setPatientComments(prev => ({ ...prev, [selectedPatient]: typeof newComments === 'function' ? newComments(prev[selectedPatient] || {}) : newComments }));
      };
      const [showDataTable, setShowDataTable] = useState(false);
      const [topNOnlyViz, setTopNOnlyViz] = useState(false);
      const [selectedRow, setSelectedRow] = useState(null);
      const [showAlleleTable, setShowAlleleTable] = useState(true);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [viewMode, setViewMode] = useState('patient');
      const [globalFormula, setGlobalFormula] = useState('');
      const [patientFormulas, setPatientFormulas] = useState({});
      const [patientTopN, setPatientTopN] = useState({});
      const [patientSortMetrics, setPatientSortMetrics] = useState({});
      const [isPreloading, setIsPreloading] = useState(false);
      const [preloadError, setPreloadError] = useState('');
      const [selectedTumorType, setSelectedTumorType] = useState('BRCA');
      const [selectedTumorSubtype, setSelectedTumorSubtype] = useState('');
      const [bundleError, setBundleError] = useState('');
      const [bundleStatus, setBundleStatus] = useState('');
      const [bundleEntries, setBundleEntries] = useState(null); // {name: Uint8Array} raw tar entries kept for phase 2
      const [bundlePatients, setBundlePatients] = useState(null); // [{id, files, sizeMB}] for patient selection
      const [availableBundlePatients, setAvailableBundlePatients] = useState(null); // [patientId, ...] for lazy-load sidebar
      const [bundlePatientMeta, setBundlePatientMeta] = useState(null); // {pid: {pmhcCount, alleles}}
      const [mobileView, setMobileView] = useState('visualizations'); // 'visualizations' or 'pmhcs'
      const [patientTab, setPatientTab] = useState('report');
      const [reportTemplate, setReportTemplate] = useState(DEFAULT_REPORT_TEMPLATE);
      const [reportFiles, setReportFiles] = useState({});
      const [qcData, setQcData] = useState({}); // QC data organized by patient/sample
      const [qcFilesMap, setQcFilesMap] = useState(null); // {path: Uint8Array} for bundle QC file serving
      const [cohortQcData, setCohortQcData] = useState(null); // Cohort-level QC summary
      const [manifestData, setManifestData] = useState(null); // Manifest group data
      const [selectedGroup, setSelectedGroup] = useState(null); // Current group for multi-group patients
      const [orderedGroups, setOrderedGroups] = useState([]); // Draggable group order for multi-group patients

      // Resolve QC file paths to blob URLs in bundle mode
      useEffect(() => {
        if (!qcFilesMap) { _qcFileUrls = {}; return; }
        const urls = {};
        for (const [path, content] of Object.entries(qcFilesMap)) {
          const ext = path.split('.').pop().toLowerCase();
          const mimeTypes = { pdf: 'application/pdf', html: 'text/html', htm: 'text/html', json: 'application/json', tsv: 'text/tab-separated-values', txt: 'text/plain' };
          const blob = new Blob([content], { type: mimeTypes[ext] || 'application/octet-stream' });
          urls[path] = URL.createObjectURL(blob);
        }
        _qcFileUrls = urls;
      }, [qcFilesMap]);

      const matchesAnyPattern = (filename, patterns = []) => {
        if (!Array.isArray(patterns) || patterns.length === 0) return true;
        const basename = filename.split('/').pop();
        return patterns.some(pattern => {
          const escaped = String(pattern).replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.');
          const regex = new RegExp(`^${escaped}$`, 'i');
          return regex.test(basename) || regex.test(filename);
        });
      };

      // Collect file patterns from report sections (excluding QC sections)
      // Used to filter which files from the preload directory should be parsed as report data
      const getReportSectionPatterns = (template) => {
        const sections = template?.sections || [];
        return sections
          .filter(s => s.source !== 'qc' && s.renderer !== 'qc_summary')
          .flatMap(s => s.patterns || []);
      };

      const parseDelimitedRows = (filename, content) => {
        const lines = String(content || '').split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) return [];
        const delimiter = lines[0].includes('\t') ? '\t' : ',';
        const headers = lines[0].split(delimiter);
        return lines.slice(1).map((line, idx) => {
          const values = line.split(delimiter);
          const row = { _source_file: filename, _row_index: idx + 1 };
          headers.forEach((header, colIdx) => { row[header] = values[colIdx] ?? ''; });
          return row;
        });
      };

      const loadFilesMap = (filesMap, manifestOverride = null) => {
        let parsed = {};
        const nextReportFiles = {};
        const activeManifest = manifestOverride || manifestData;
        const reportPatterns = getReportSectionPatterns(reportTemplate);
        let parsedRows = 0;
        for (const [filename, content] of Object.entries(filesMap)) {
          const basename = filename.split('/').pop();
          // Skip QC summary files — they shouldn't be mixed into pMHC patient data
          if (isQcSummaryContent(content)) continue;
          // Skip files that don't match any report section's patterns
          const matchesSection = reportPatterns.length === 0 || matchesAnyPattern(filename, reportPatterns);
          if (!matchesSection) continue;
          const rows = parseDelimitedRows(filename, content);
          nextReportFiles[filename] = {
            name: filename,
            basename,
            content,
            rows
          };
          parsedRows += rows.length;
          parsed = parseFileContent(filename, content, parsed, activeManifest);
        }
        // Auto-detect: if data has peptide/allele columns but template
        // uses generic renderer, upgrade to report renderer
        const firstPatient = Object.values(parsed)[0];
        if (firstPatient?.data?.[0]) {
          const dataKeys = Object.keys(firstPatient.data[0]);
          const hasReportCols = dataKeys.includes('peptide') && dataKeys.includes('allele');
          if (hasReportCols) {
            setReportTemplate(prev => {
              const sections = (prev.sections || []).map(s => {
                if (s.source === 'qc' || s.renderer === 'qc_summary' || s.renderer === 'report' || s.renderer === 'lens_antigen_report') return s;
                if (!s.renderer || s.renderer === 'table') {
                  return { ...s, renderer: 'report' };
                }
                return s;
              });
              return { ...prev, sections };
            });
          }
        }
        setReportFiles(nextReportFiles);
        setPatients({...parsed});
        const fileCount = Object.keys(nextReportFiles).length;
        const patientCount = Object.keys(parsed).length;
        if (fileCount > 0 && patientCount === 0) {
          setBundleError(`Loaded ${fileCount} report file(s), but no patient rows were parsed. Check that the report files are tab-delimited and include a header row.`);
        } else if (fileCount > 0) {
          setBundleStatus(`Loaded ${fileCount} report file(s), ${parsedRows} row(s), and ${patientCount} patient(s).`);
        }
        const firstId = Object.keys(parsed).sort()[0];
        if (firstId) {
          setSelectedPatient(firstId);
          const patient = parsed[firstId];
          if (patient.isMultiGroup && patient.groups.length > 0) {
            const bestGroup = patient.groups.find(g => patient.groupData[g] && patient.groupData[g].data.length > 0) || patient.groups[0];
            setSelectedGroup(bestGroup);
            const groupData = patient.groupData[bestGroup];
            setSelectedAlleles(new Set(groupData.alleles));
            setSelectedAntigenSources(new Set(groupData.antigenSources));
          } else {
            setSelectedAlleles(new Set(patient.alleles));
            setSelectedAntigenSources(new Set(patient.antigenSources));
          }
        }
      };

      const decodeTarEntries = (bytes) => {
        const decoder = new TextDecoder();
        const entries = {};
        let offset = 0;
        let pendingPax = null;   // PAX header attrs for next entry
        let globalPax = null;    // global PAX attrs
        while (offset + 512 <= bytes.length) {
          const header = bytes.slice(offset, offset + 512);
          const isEmpty = header.every(b => b === 0);
          if (isEmpty) break;
          const name = decoder.decode(header.slice(0, 100)).replace(/\0.*$/, '');
          const prefix = decoder.decode(header.slice(345, 500)).replace(/\0.*$/, '').trim();
          const sizeText = decoder.decode(header.slice(124, 136)).replace(/\0.*$/, '').trim();
          const size = parseInt(sizeText || '0', 8);
          const typeflag = String.fromCharCode(header[156] || 48);
          offset += 512;

          // PAX extended header (typeflag 'x') — apply to next entry
          if (typeflag === 'x') {
            const paxData = decoder.decode(bytes.slice(offset, offset + size));
            const attrs = {};
            for (const line of paxData.split('\n')) {
              const m = line.match(/^\d+\s+(\S+?)=(.*)/);
              if (m) attrs[m[1]] = m[2];
            }
            pendingPax = attrs;
            offset += Math.ceil(size / 512) * 512;
            continue;
          }
          // PAX global header (typeflag 'g')
          if (typeflag === 'g') {
            const paxData = decoder.decode(bytes.slice(offset, offset + size));
            const attrs = {};
            for (const line of paxData.split('\n')) {
              const m = line.match(/^\d+\s+(\S+?)=(.*)/);
              if (m) attrs[m[1]] = m[2];
            }
            globalPax = attrs;
            offset += Math.ceil(size / 512) * 512;
            continue;
          }

          // Regular file
          if (typeflag === '0' || typeflag === '\0') {
            // Resolve full name: PAX path > prefix/name
            let fullName = prefix ? `${prefix}/${name}` : name;
            const mergedPax = { ...(globalPax || {}), ...(pendingPax || {}) };
            if (mergedPax.path) fullName = mergedPax.path;
            entries[fullName] = bytes.slice(offset, offset + size);
          }
          pendingPax = null;
          offset += Math.ceil(size / 512) * 512;
        }
        return entries;
      };

      const maybeGunzip = async (bytes) => {
        const isGzip = bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
        if (!isGzip) return bytes;
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('This browser cannot decompress .tar.gz files. Try a current Chrome, Edge, Firefox, or Safari release.');
        }
        const ds = new DecompressionStream('gzip');
        const writer = ds.writable.getWriter();
        writer.write(bytes);
        writer.close();
        const buffer = await new Response(ds.readable).arrayBuffer();
        return new Uint8Array(buffer);
      };

      // Lightweight TSV scan: count rows and extract allele values without full parse
      const quickScanTsv = (content) => {
        // Find first newline (end of header)
        let headerEnd = 0;
        while (headerEnd < content.length && content[headerEnd] !== 10) headerEnd++;
        if (headerEnd >= content.length) return { pmhcCount: 0, alleles: new Set() };
        const headerLine = new TextDecoder().decode(content.slice(0, headerEnd));
        const headers = headerLine.split('\t');
        const alleleIdx = headers.findIndex(h => h === 'allele' || h === 'HLA_allele' || h === 'mhc_allele');
        // Count remaining newlines for pMHC count and extract allele column
        let pmhcCount = 0;
        const alleles = new Set();
        let rowStart = headerEnd + 1;
        for (let i = headerEnd + 1; i <= content.length; i++) {
          if (i === content.length || content[i] === 10) {
            pmhcCount++;
            if (alleleIdx >= 0 && i > rowStart) {
              // Find the allele column in this row
              let col = 0, colStart = rowStart;
              for (let j = rowStart; j < i && col < alleleIdx; j++) {
                if (content[j] === 9) { col++; colStart = j + 1; } // tab
              }
              if (col === alleleIdx) {
                let colEnd = colStart;
                while (colEnd < i && content[colEnd] !== 9) colEnd++;
                const val = new TextDecoder().decode(content.slice(colStart, colEnd)).trim();
                if (val && val !== 'NA' && val !== 'N/A') alleles.add(val);
              }
            }
            rowStart = i + 1;
          }
        }
        return { pmhcCount: Math.max(0, pmhcCount - (content[content.length - 1] === 10 ? 1 : 0)), alleles };
      };

      const loadTarBundle = async (arrayBuffer) => {
        setBundleStatus('Decompressing bundle...');
        const bytes = await maybeGunzip(new Uint8Array(arrayBuffer));
        setBundleStatus('Extracting tar entries...');
        const entries = decodeTarEntries(bytes);
        const entryNames = Object.keys(entries);
        const entryCount = entryNames.length;
        console.log('[RAFT bundle] Decoded entries:', entryCount);
        const textDecoder = new TextDecoder();
        let bundleManifestData = null;
        let bundleQcData = null;
        let bundleReportTemplate = null;
        let bundleMetadata = null;
        // Phase 1: Extract metadata only and collect TSV file names with sizes
        const tsvEntries = [];
        let totalSizeBytes = 0;
        for (const [name, content] of Object.entries(entries)) {
          const basename = name.split('/').pop();
          if (basename === 'raft-report-bundle.json') {
            bundleMetadata = JSON.parse(textDecoder.decode(content));
            continue;
          }
          if (basename === 'manifest-groups.json') {
            bundleManifestData = JSON.parse(textDecoder.decode(content));
            continue;
          }
          if (basename === 'qc-data.json') {
            bundleQcData = JSON.parse(textDecoder.decode(content));
            continue;
          }
          if (basename === 'report-ui.json' || basename.match(/\.report-ui\.json$/)) {
            bundleReportTemplate = JSON.parse(textDecoder.decode(content));
            continue;
          }
          if (!name.match(/\.(tsv|txt)$/i)) continue;
          // Skip QC summary files — they don't contain pMHC data
          if (isQcSummaryContent(textDecoder.decode(content.slice(0, 500)))) continue;
          const scan = quickScanTsv(content);
          tsvEntries.push({ name, size: content.byteLength, pmhcCount: scan.pmhcCount, alleles: scan.alleles });
          totalSizeBytes += content.byteLength;
        }
        console.log('[RAFT bundle] TSV entries:', tsvEntries.length, 'hasQc:', !!bundleQcData, 'hasTemplate:', !!bundleReportTemplate);
        if (bundleManifestData) setManifestData(bundleManifestData);
        if (bundleQcData) setQcData(bundleQcData);
        if (bundleReportTemplate) setReportTemplate(normalizeReportTemplate(bundleReportTemplate));

        // Infer patient IDs from TSV paths using the manifest
        const patientMap = {};
        const manifestPatients = bundleManifestData ? Object.keys(bundleManifestData.patients || {}) : [];
        for (const entry of tsvEntries) {
          const pid = inferPatientIdFromFilename(entry.name, bundleManifestData);
          if (!patientMap[pid]) patientMap[pid] = { id: pid, files: [], sizeBytes: 0, pmhcCount: 0, alleles: new Set() };
          patientMap[pid].files.push(entry.name);
          patientMap[pid].sizeBytes += entry.size;
          patientMap[pid].pmhcCount += entry.pmhcCount;
          entry.alleles.forEach(a => patientMap[pid].alleles.add(a));
        }
        const patientList = Object.values(patientMap).sort((a, b) => a.id.localeCompare(b.id));
        console.log('[RAFT bundle] Patient list:', patientList.length);

        if (patientList.length === 0 && !bundleQcData && !bundleReportTemplate) {
          throw new Error('Bundle did not contain report files, QC data, or a report UI template.');
        }

        // If only one patient, skip selection and load directly
        if (patientList.length <= 1) {
          setBundleStatus(patientList.length === 1
            ? `Loading 1 patient (${(totalSizeBytes / (1024 * 1024)).toFixed(1)} MB of data)...`
            : 'Loading QC data...');
          await new Promise(r => setTimeout(r, 0));
          const filesMap = {};
          for (const entry of tsvEntries) {
            filesMap[entry.name] = textDecoder.decode(entries[entry.name]);
          }
          // Collect QC files
          const bundleQcFiles = {};
          for (const [name, content] of Object.entries(entries)) {
            if (name.startsWith('qc/')) bundleQcFiles[name] = content;
          }
          if (Object.keys(bundleQcFiles).length > 0) setQcFilesMap(bundleQcFiles);
          if (bundleMetadata?.file_counts) {
            const reportCount = bundleMetadata.file_counts.reports || bundleMetadata.file_counts.lens || bundleMetadata.file_counts.report || 0;
            setBundleStatus(`Bundle contains ${reportCount} report file(s). Parsing data...`);
          } else if (tsvEntries.length > 0) {
            setBundleStatus(`Parsing ${tsvEntries.length} report file(s)...`);
          }
          if (Object.keys(filesMap).length > 0) {
            loadFilesMap(filesMap, bundleManifestData);
          } else {
            setReportFiles({});
            setPatients({});
          }
          setIsPreloading(false);
          return;
        }

        // Multiple patients: show selection UI, keep raw entries for phase 2
        setBundleEntries(entries);
        setBundlePatients(patientList);
        const metaMap = {};
        patientList.forEach(p => { metaMap[p.id] = { pmhcCount: p.pmhcCount, alleles: p.alleles }; });
        setBundlePatientMeta(metaMap);
        setBundleStatus(`Found ${patientList.length} patients in bundle. Select which to load.`);
        setIsPreloading(false);
      };

      const loadSelectedPatients = async (selectedPatientIds) => {
        setIsPreloading(true);
        setBundleStatus('Loading selected patients...');
        const textDecoder = new TextDecoder();
        const entries = bundleEntries;
        const bundleQcFiles = {};
        const filesMap = {};
        const firstPid = selectedPatientIds[0];
        // Lazy-load: only decode the first selected patient's TSV data
        for (const [name, content] of Object.entries(entries)) {
          const basename = name.split('/').pop();
          if (basename === 'raft-report-bundle.json' || basename === 'manifest-groups.json' ||
              basename === 'qc-data.json' || basename === 'report-ui.json' || basename.match(/\.report-ui\.json$/)) {
            continue;
          }
          if (name.startsWith('qc/')) { bundleQcFiles[name] = content; continue; }
          if (!name.match(/\.(tsv|txt)$/i)) continue;
          const pid = inferPatientIdFromFilename(name, manifestData);
          if (pid === firstPid) {
            filesMap[name] = textDecoder.decode(content);
          }
        }
        if (Object.keys(bundleQcFiles).length > 0) setQcFilesMap(bundleQcFiles);
        setBundleStatus(`Loaded ${Object.keys(filesMap).length} file(s). Parsing data...`);
        await new Promise(r => setTimeout(r, 0));
        if (Object.keys(filesMap).length > 0) {
          loadFilesMap(filesMap, manifestData);
        } else {
          setReportFiles({});
          setPatients({});
        }
        // Store available patient IDs for sidebar navigation (lazy-load on click)
        setAvailableBundlePatients(selectedPatientIds);
        setSelectedPatient(firstPid);
        setBundlePatients(null); // Hide selection UI, keep bundleEntries for lazy loading
        setIsPreloading(false);
      };

      const handleBundleUpload = (e) => {
        setBundleError('');
        setBundleStatus('');
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;

        const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
        setBundleStatus(`Reading ${file.name} (${sizeMB} MB)...`);
        setIsPreloading(true);

        const reader = new FileReader();
        reader.onload = async () => {
          try {
            if (file.name.match(/\.(tar|tgz|tar\.gz)$/i)) {
              await loadTarBundle(reader.result);
            } else {
              setBundleStatus('Parsing bundle...');
              const bundleText = String(new TextDecoder().decode(new Uint8Array(reader.result)) || '');
              const bundle = JSON.parse(bundleText);
              const filesMap = bundle.files || bundle;
              if (!filesMap || typeof filesMap !== 'object') {
                throw new Error('Bundle missing files payload');
              }
              loadFilesMap(filesMap);
            }
          } catch (err) {
            setBundleError(`Failed to load bundle: ${err.message}`);
          } finally {
            setIsPreloading(false);
          }
        };
        reader.onerror = () => { setBundleError('Failed to read selected bundle file.'); setIsPreloading(false); };
        reader.readAsArrayBuffer(file);
      };

      // Parse file content with group support
      const inferPatientIdFromFilename = (filename, manifest = null) => {
        const parts = String(filename || '').split('/').filter(Boolean);
        const manifestPatients = Object.keys(manifest?.patients || {});
        const matchedPatient = manifestPatients.find(patientId => parts.includes(patientId));
        if (matchedPatient) return matchedPatient;

        if ((parts[0] === 'lens' || parts[0] === 'report') && parts.length >= 3) {
          return parts[2];
        }

        const basename = parts.length ? parts[parts.length - 1] : String(filename || '');
        const match = basename.match(/^[^-]+-([^-]+)-/);
        if (match) return match[1];
        return basename.split('.')[0].split('-')[0] || basename.split('_')[0] || 'unknown';
      };

      // Detect QC summary files (section/metric/value/level/detail format)
      // These should not be mixed into pMHC patient data
      const isQcSummaryContent = (content) => {
        const firstLine = String(content || '').split(/\r?\n/)[0] || '';
        const headers = firstLine.split('\t').map(h => h.trim());
        const qcColumns = ['section', 'metric', 'value'];
        return qcColumns.every(col => headers.includes(col));
      };

      const parseFileContent = (filename, content, parsedPatients, manifest = null) => {
        const lines = content.split('\n');
        if (lines.length < 2) return parsedPatients;
        const headers = lines[0].split('\t');

        // Skip QC summary files — they have a different column structure
        // and belong in the QC section, not mixed into pMHC data
        const qcCols = ['section', 'metric', 'value'];
        if (qcCols.every(col => headers.includes(col))) return parsedPatients;

        const patientId = inferPatientIdFromFilename(filename, manifest);

        // Determine which groups this file belongs to
        const runNames = extractRunNamesFromFilename(filename);
        const fileGroups = determineFileGroups(runNames, manifest);

        // Parse data rows
        const data = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const values = lines[i].split('\t');
          const row = {};
          headers.forEach((header, idx) => { row[header] = values[idx]; });
          row._source_file = filename;
          data.push(row);
        }

        // Check if this patient has multiple groups in manifest
        const patientManifest = manifest?.patients?.[patientId];
        const isMultiGroup = patientManifest && patientManifest.groups && patientManifest.groups.length > 1;

        // Initialize patient if not exists
        if (!parsedPatients[patientId]) {
          if (isMultiGroup) {
            // Multi-group patient: hierarchical structure
            parsedPatients[patientId] = {
              id: patientId,
              isMultiGroup: true,
              groups: [...patientManifest.groups],
              groupData: {},
              // Also maintain flat data for compatibility
              files: [],
              data: [],
              alleles: new Set(),
              alleleSupport: {},
              antigenSources: new Set()
            };
            // Initialize each group
            for (const group of patientManifest.groups) {
              parsedPatients[patientId].groupData[group] = {
                files: [],
                data: [],
                alleles: new Set(),
                alleleSupport: {},
                antigenSources: new Set()
              };
            }
          } else {
            // Single-group patient: flat structure (backward compatible)
            parsedPatients[patientId] = {
              id: patientId,
              isMultiGroup: false,
              groups: fileGroups.length > 0 ? fileGroups : ['default'],
              files: [],
              data: [],
              alleles: new Set(),
              alleleSupport: {},
              antigenSources: new Set()
            };
          }
        }

        // Helper to add data to a group structure
        const addDataToGroup = (groupData) => {
          groupData.files.push(filename);
          groupData.data.push(...data);
          data.forEach(row => {
            if (row.allele) {
              groupData.alleles.add(row.allele);
              if (!groupData.alleleSupport[row.allele]) {
                groupData.alleleSupport[row.allele] = {};
              }
              if (row.hla_allele_support) {
                row.hla_allele_support.split(';').forEach(support => {
                  const [tool, sampleType] = support.split(':');
                  if (tool && sampleType) {
                    if (!groupData.alleleSupport[row.allele][tool]) {
                      groupData.alleleSupport[row.allele][tool] = new Set();
                    }
                    groupData.alleleSupport[row.allele][tool].add(sampleType);
                  }
                });
              }
            }
            if (row.antigen_source) {
              groupData.antigenSources.add(row.antigen_source);
            }
          });
        };

        // Add data to appropriate groups
        if (parsedPatients[patientId].isMultiGroup) {
          // Add to specific groups this file belongs to
          for (const group of fileGroups) {
            if (parsedPatients[patientId].groupData[group]) {
              addDataToGroup(parsedPatients[patientId].groupData[group]);
            }
          }
          // Also add to flat structure for overall views
          addDataToGroup(parsedPatients[patientId]);
        } else {
          // Single-group: just add to flat structure
          addDataToGroup(parsedPatients[patientId]);
        }

        return parsedPatients;
      };

      // Fetch manifest group data
      useEffect(() => {
        const loadManifestData = async () => {
          try {
            const resp = await fetch(`${API_BASE}/api/manifest-groups`);
            if (resp.ok) {
              const data = await resp.json();
              if (data && (data.has_multi_group || Object.keys(data.patients || {}).length > 0)) {
                setManifestData(data);
              }
            }
          } catch (e) {
            console.warn('No manifest data available:', e);
          }
        };
        loadManifestData();
      }, []);

      // Fetch workflow-owned report template when running through the local RAFT API.
      useEffect(() => {
        const loadReportTemplate = async () => {
          if (IS_GITHUB_HOSTED) return;
          try {
            const urlParams = getUrlParams();
            const query = new URLSearchParams();
            ['workflow', 'version', 'species', 'input'].forEach(key => {
              if (urlParams[key]) query.set(key, urlParams[key]);
            });
            const suffix = query.toString() ? `?${query.toString()}` : '';
            const resp = await fetch(`${API_BASE}/api/report-template${suffix}`);
            if (resp.ok) {
              const data = await resp.json();
              setReportTemplate(normalizeReportTemplate(data));
            }
          } catch (e) {
            console.warn('No report template available:', e);
          }
        };
        loadReportTemplate();
      }, []);

      // Fetch QC data from backend
      useEffect(() => {
        const loadQcData = async () => {
          try {
            const resp = await fetch(`${API_BASE}/api/qc-data`);
            if (resp.ok) {
              const data = await resp.json();
              if (data && Object.keys(data.patients || {}).length > 0) {
                setQcData(data);
              }
            }
          } catch (e) {
            console.warn('No QC data available:', e);
          }
        };
        loadQcData();
      }, []);

      // Upgrade patients to multi-group when QC data detects groups (no manifest needed)
      useEffect(() => {
        if (!qcData?.summaries || Object.keys(patients).length === 0) return;

        let updated = false;
        const newPatients = { ...patients };

        for (const [patientId, patient] of Object.entries(newPatients)) {
          if (patient.isMultiGroup) continue; // Already multi-group

          const summary = qcData.summaries[patientId];
          if (!summary?.groups || summary.groups.length < 2) continue;

          const qcGroups = summary.groups;
          const groupIds = qcGroups.map(g => g.id);

          // Build run_name -> [group_ids] mapping from QC summary
          const runToGroups = {};
          for (const sample of summary.samples || []) {
            if (sample.group) {
              runToGroups[sample.run_dir] = [sample.group];
            } else {
              // Shared sample - belongs to all groups
              runToGroups[sample.run_dir] = [...groupIds];
            }
          }
          // Also map multi-sample run dirs
          for (const ms of summary.multi_sample || []) {
            if (ms.group) {
              // Each component run also maps to this group
              for (const part of ms.run_dir.split('+')) {
                if (!runToGroups[part]) {
                  runToGroups[part] = [ms.group];
                } else if (!runToGroups[part].includes(ms.group)) {
                  runToGroups[part].push(ms.group);
                }
              }
            }
          }

          // Initialize group data
          const groupData = {};
          for (const gid of groupIds) {
            groupData[gid] = {
              files: [], data: [], alleles: new Set(),
              alleleSupport: {}, antigenSources: new Set(),
            };
          }

          // Partition files and rows into groups using _source_file tag
          for (const row of (patient.data || [])) {
            const filename = row._source_file;
            if (!filename) continue;
            const runNames = extractRunNamesFromFilename(filename);

            // File belongs to group if ALL its run names belong to that group
            const fileGroupIds = groupIds.filter(gid =>
              runNames.every(rn => {
                const rnGroups = runToGroups[rn];
                return rnGroups && rnGroups.includes(gid);
              })
            );

            for (const gid of fileGroupIds) {
              groupData[gid].data.push(row);
              if (row.allele) {
                groupData[gid].alleles.add(row.allele);
                if (!groupData[gid].alleleSupport[row.allele]) {
                  groupData[gid].alleleSupport[row.allele] = {};
                }
                if (row.hla_allele_support) {
                  row.hla_allele_support.split(';').forEach(support => {
                    const [tool, sampleType] = support.split(':');
                    if (tool && sampleType) {
                      if (!groupData[gid].alleleSupport[row.allele][tool]) {
                        groupData[gid].alleleSupport[row.allele][tool] = new Set();
                      }
                      groupData[gid].alleleSupport[row.allele][tool].add(sampleType);
                    }
                  });
                }
              }
              if (row.antigen_source) {
                groupData[gid].antigenSources.add(row.antigen_source);
              }
            }
          }

          // Track files per group
          for (const filename of (patient.files || [])) {
            const runNames = extractRunNamesFromFilename(filename);
            const fileGroupIds = groupIds.filter(gid =>
              runNames.every(rn => {
                const rnGroups = runToGroups[rn];
                return rnGroups && rnGroups.includes(gid);
              })
            );
            for (const gid of fileGroupIds) {
              groupData[gid].files.push(filename);
            }
          }

          // Upgrade patient
          newPatients[patientId] = {
            ...patient,
            isMultiGroup: true,
            groups: groupIds,
            groupLabels: Object.fromEntries(qcGroups.map(g => [g.id, g.label])),
            groupData,
          };
          updated = true;
        }

        if (updated) {
          setPatients(newPatients);
          // Auto-select first group if current patient was upgraded
          const current = newPatients[selectedPatient];
          if (current?.isMultiGroup && (!selectedGroup || selectedGroup === null)) {
            setSelectedGroup(current.groups[0]);
            const gd = current.groupData[current.groups[0]];
            if (gd) {
              setSelectedAlleles(new Set(gd.alleles));
              setSelectedAntigenSources(new Set(gd.antigenSources));
            }
          }
        }
      }, [qcData, Object.keys(patients).length]);

      // Extract run names from filename (separated by '+')
      const extractRunNamesFromFilename = (filename) => {
        const pathParts = String(filename || '').split('/').filter(Boolean);
        const basename = pathParts.length ? pathParts[pathParts.length - 1] : String(filename || '');
        const candidates = [...pathParts, ...basename.split('+')];
        // Example: PROJ-PAT001-ad-PAT001-pre+nd-PAT001-normal.lens.tsv
        const runNames = [];
        for (const part of candidates) {
          // Extract run name pattern: prefix-identifier (e.g., ad-PAT001-pre, nd-PAT001-normal)
          const match = part.match(/((?:ad|ar|nd|nr)-[^/.+]+)/);
          if (match && !runNames.includes(match[1])) {
            runNames.push(match[1]);
          }
        }
        return runNames;
      };

      // Determine which groups a file belongs to based on run names
      const determineFileGroups = (runNames, manifest) => {
        if (!manifest || !manifest.run_to_groups || runNames.length === 0) {
          return ['default'];
        }

        const allGroups = manifest.all_groups || ['default'];

        // A file belongs to a group if ALL its run names are members of that group
        return allGroups.filter(group =>
          runNames.every(runName => {
            const runGroups = manifest.run_to_groups[runName];
            return runGroups && runGroups.includes(group);
          })
        );
      };

      // Preload files from server
      useEffect(() => {
        const urlParams = getUrlParams();
        if (urlParams.demo === '1' || urlParams.demo.toLowerCase() === 'true') {
          const loadDemoFiles = async () => {
            setIsPreloading(true);
            try {
              let parsed = {};
              DEMO_FILES.forEach(file => {
                parsed = parseFileContent(file.name, file.content, parsed, DEMO_MANIFEST);
              });

              setPatients({ ...parsed });
              setQcData(DEMO_QC_DATA);
              const firstId = Object.keys(parsed).sort()[0];
              if (firstId) {
                setSelectedPatient(firstId);
                const patient = parsed[firstId];
                if (patient.isMultiGroup && patient.groups.length > 0) {
                  const bestGroup = patient.groups.find(g => patient.groupData[g] && patient.groupData[g].data.length > 0) || patient.groups[0];
                  setSelectedGroup(bestGroup);
                  const groupData = patient.groupData[bestGroup];
                  setSelectedAlleles(new Set(groupData.alleles));
                  setSelectedAntigenSources(new Set(groupData.antigenSources));
                } else {
                  setSelectedAlleles(new Set(patient.alleles));
                  setSelectedAntigenSources(new Set(patient.antigenSources));
                }
              }
            } catch (e) {
              setPreloadError(`Demo load failed: ${e.message}`);
            }
            setIsPreloading(false);
          };
          loadDemoFiles();
          return;
        }
        if (!urlParams.preload) return;

        const loadFiles = async () => {
          setIsPreloading(true);
          try {
            // First fetch manifest data if not already loaded
            let manifest = manifestData;
            if (!manifest) {
              try {
                const manifestResp = await fetch(`${API_BASE}/api/manifest-groups`);
                if (manifestResp.ok) {
                  manifest = await manifestResp.json();
                  setManifestData(manifest);
                }
              } catch (e) { /* ignore */ }
            }

            // Collect section patterns to filter which files should be loaded from server
            const reportPatterns = getReportSectionPatterns(reportTemplate);
            const patternsParam = reportPatterns.length > 0 ? `&patterns=${encodeURIComponent(reportPatterns.join(','))}` : '';
            const listResp = await fetch(`${API_BASE}/api/files?dir=${encodeURIComponent(urlParams.preload)}${patternsParam}`);
            if (!listResp.ok) throw new Error('Failed to list files');
            const { files } = await listResp.json();
            if (files.length === 0) { setPreloadError('No TSV files found.'); setIsPreloading(false); return; }

            let parsed = {};
            const nextReportFiles = {};
            for (const file of files) {
              const contentResp = await fetch(`${API_BASE}/api/file-content?path=${encodeURIComponent(file.path)}&dir=${encodeURIComponent(urlParams.preload)}`);
              if (contentResp.ok) {
                const { name, content } = await contentResp.json();
                const basename = name.split('/').pop();
                // Only parse files that match a report section's patterns
                // Skip files that don't match any pattern (e.g., QC summary files in the reports directory)
                const matchesSection = reportPatterns.length === 0 || matchesAnyPattern(name, reportPatterns);
                // Additional safety: skip QC summary files by content structure
                const isQcFile = isQcSummaryContent(content);
                if (matchesSection && !isQcFile) {
                  parsed = parseFileContent(name, content, parsed, manifest);
                }
                // Still add to reportFiles for file index display if it matches section patterns
                if (matchesSection && !isQcFile) {
                  const rows = parseDelimitedRows(name, content);
                  nextReportFiles[name] = { name, basename, content, rows };
                }
              }
            }

            setPatients({...parsed});
            setReportFiles(nextReportFiles);
            const firstId = Object.keys(parsed).sort()[0];
            if (firstId) {
              setSelectedPatient(firstId);
              const patient = parsed[firstId];
              // For multi-group patients, auto-select the first group that has data
              if (patient.isMultiGroup && patient.groups.length > 0) {
                const bestGroup = patient.groups.find(g => patient.groupData[g] && patient.groupData[g].data.length > 0) || patient.groups[0];
                setSelectedGroup(bestGroup);
                const groupData = patient.groupData[bestGroup];
                setSelectedAlleles(new Set(groupData.alleles));
                setSelectedAntigenSources(new Set(groupData.antigenSources));
              } else {
                setSelectedAlleles(new Set(patient.alleles));
                setSelectedAntigenSources(new Set(patient.antigenSources));
              }
            }
          } catch (e) { setPreloadError(`Load failed: ${e.message}`); }
          setIsPreloading(false);
        };
        loadFiles();
      }, []);

      // Responsive behavior - auto-collapse sidebar on smaller screens
      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth < 1024) {
            setSidebarCollapsed(true);
          }
        };
        handleResize(); // Check on mount
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // Reset group order when selected patient or its groups change
      useEffect(() => {
        const p = patients[selectedPatient];
        if (p?.groups && p.groups.length > 0) {
          setOrderedGroups([...p.groups]);
        } else {
          setOrderedGroups([]);
        }
      }, [selectedPatient, patients[selectedPatient]?.groups?.join(',')]);

      // Handle file upload
      const handleFileUpload = (e) => {
        const fileList = Array.from(e.target.files);
        let parsed = {};
        let processed = 0;

        fileList.forEach(file => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            // Skip QC summary files — they shouldn't be mixed into pMHC data
            if (!isQcSummaryContent(ev.target.result)) {
              parsed = parseFileContent(file.name, ev.target.result, parsed, manifestData);
            }
            processed++;
            if (processed === fileList.length) {
              setPatients({...parsed});
              const firstId = Object.keys(parsed).sort()[0];
              if (firstId) {
                setSelectedPatient(firstId);
                const patient = parsed[firstId];
                if (patient.isMultiGroup && patient.groups.length > 0) {
                  const bestGroup = patient.groups.find(g => patient.groupData[g] && patient.groupData[g].data.length > 0) || patient.groups[0];
                  setSelectedGroup(bestGroup);
                  const groupData = patient.groupData[bestGroup];
                  setSelectedAlleles(new Set(groupData.alleles));
                  setSelectedAntigenSources(new Set(groupData.antigenSources));
                } else {
                  setSelectedAlleles(new Set(patient.alleles));
                  setSelectedAntigenSources(new Set(patient.antigenSources));
                }
              }
            }
          };
          reader.readAsText(file);
        });
      };

      // Formula evaluation
      const evaluateFormula = (formula, row, allRows) => {
        if (!formula || !formula.trim()) return null;
        try {
          let expression = formula.trim();

          // Handle bound1() function
          const bound1Regex = /bound1\(([^)]+)\)/g;
          expression = expression.replace(bound1Regex, (match, columnName) => {
            const col = columnName.trim();
            const values = allRows.map(r => parseFloat(r[col])).filter(v => !isNaN(v) && v > 0);
            if (values.length === 0) return '0';
            const maxValue = Math.max(...values);
            const currentValue = parseFloat(row[col]);
            if (isNaN(currentValue) || maxValue === 0) return '0';
            return ((currentValue / maxValue) * 100).toString();
          });

          // Replace column names
          const columns = Object.keys(row).sort((a, b) => b.length - a.length);
          columns.forEach(col => {
            const value = parseFloat(row[col]);
            const numValue = isNaN(value) ? 0 : value;
            const regex = new RegExp(`\\b${col.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'g');
            expression = expression.replace(regex, numValue.toString());
          });

          expression = expression.replace(/\bmin\b/g, 'Math.min').replace(/\bmax\b/g, 'Math.max');
          const result = new Function(`return ${expression}`)();
          return isNaN(result) ? null : result;
        } catch (error) { return null; }
      };

      const getActiveFormula = () => patientFormulas[selectedPatient] || globalFormula;
      const getActiveTopN = () => patientTopN[selectedPatient] !== undefined ? patientTopN[selectedPatient] : topN;
      const getActiveSortMetric = () => patientSortMetrics[selectedPatient] || sortMetric;

      // Get the data source for current patient (group-aware)
      const getPatientDataSource = () => {
        if (!selectedPatient || !patients[selectedPatient]) return [];
        const patient = patients[selectedPatient];
        // For multi-group patients, use group-specific data (unless showing joint analysis)
        if (patient.isMultiGroup && selectedGroup && selectedGroup !== 'joint' && patient.groupData[selectedGroup]) {
          return patient.groupData[selectedGroup].data;
        }
        // For single-group or joint analysis, use all data
        return patient.data;
      };

      const getSectionRows = (section) => {
        const files = Object.values(reportFiles).filter(file => matchesAnyPattern(file.name, section?.patterns));
        const rows = files.flatMap(file => file.rows || []);
        if (!selectedPatient || rows.length === 0) return rows;
        const patientKeys = section?.patient_keys || ['Patient_Name', 'patient', 'patient_id', 'Patient', 'sample_id'];
        const filteredRows = rows.filter(row => patientKeys.some(key => String(row[key] || '') === String(selectedPatient)));
        return filteredRows.length > 0 ? filteredRows : rows;
      };

      // Resolve active section and config early so they're available for useMemos below
      const reportSections = useMemo(() => {
        return normalizeReportTemplate(reportTemplate).sections;
      }, [reportTemplate]);

      const activeSection = useMemo(() => {
        return reportSections.find(section => section.id === patientTab)
          || reportSections.find(section => section.default)
          || reportSections[0]
          || DEFAULT_REPORT_TEMPLATE.sections[0];
      }, [reportSections, patientTab]);

      const activeSectionConfig = activeSection || {};

      const isQcSection = activeSection?.renderer === 'qc_summary'
        || activeSection?.source === 'qc'
        || activeSection?.id === 'qc'
        || activeSection?.id === 'quality_control';
      const activeRenderer = activeSection?.renderer || 'table';
      const isReportSection = activeRenderer === 'report' || activeRenderer === 'lens_antigen_report';

      const visMetrics = activeSectionConfig.visualize_metrics || [];
      const numericFields = activeSectionConfig.numeric_columns || [];
      const groupByColumns = activeSectionConfig.group_by_columns || [];
      const filterColumns = activeSectionConfig.filter_columns || {};

      const activeSectionControls = activeSection?.controls || {};

      // Current patient data (filtered and sorted)
      const currentPatientData = useMemo(() => {
        let data = getPatientDataSource();
        if (data.length === 0) return [];

        if (selectedAlleles.size > 0) {
          data = data.filter(row => selectedAlleles.has(row.allele));
        }
        if (selectedAntigenSources.size > 0) {
          data = data.filter(row => selectedAntigenSources.has(row.antigen_source));
        }

        const formula = getActiveFormula();
        if (formula && formula.trim()) {
          data = data.map(row => ({ ...row, custom_score: evaluateFormula(formula, row, data) }));
        }

        const activeSortMetric = (formula && formula.trim()) ? 'custom_score' : getActiveSortMetric();
        data = [...data].sort((a, b) => (parseFloat(b[activeSortMetric]) || 0) - (parseFloat(a[activeSortMetric]) || 0));

        return data.slice(0, getActiveTopN());
      }, [selectedPatient, patients, selectedGroup, selectedAlleles, selectedAntigenSources, sortMetric, topN, globalFormula, patientFormulas, patientTopN, patientSortMetrics]);

      // Group currentPatientData by peptide+allele to collapse duplicate genomic origins
      const groupedPatientData = useMemo(() => {
        const _groupByCols = (reportTemplate?.sections?.find(s => s.renderer === 'report' || s.renderer === 'lens_antigen_report')?.group_by_columns) || [];
        const groups = {};
        for (const row of currentPatientData) {
          const key = _groupByCols.map(c => row[c]).join('-');
          if (!groups[key]) groups[key] = [];
          groups[key].push(row);
        }
        const numericFields = (reportTemplate?.sections?.find(s => s.renderer === 'report' || s.renderer === 'lens_antigen_report')?.numeric_columns) || [];
        return Object.values(groups).map(group => {
          const isDuplicate = group.length > 1;
          if (!isDuplicate) return { key: `${group[0].peptide}-${group[0].allele}`, isDuplicate: false, rows: group, avgRow: group[0] };
          const avgRow = { ...group[0] };
          for (const field of numericFields) {
            const values = group.map(r => parseFloat(r[field])).filter(v => !isNaN(v));
            if (values.length > 0) avgRow[field] = (values.reduce((a, b) => a + b, 0) / values.length).toString();
          }
          return { key: `${group[0].peptide}-${group[0].allele}`, isDuplicate: true, rows: group, avgRow };
        });
      }, [currentPatientData]);

      // Full filtered data (for visualizations)
      const fullPatientData = useMemo(() => {
        let data = getPatientDataSource();
        if (data.length === 0) return [];
        if (selectedAlleles.size > 0) data = data.filter(row => selectedAlleles.has(row.allele));
        if (selectedAntigenSources.size > 0) data = data.filter(row => selectedAntigenSources.has(row.antigen_source));
        const activeSortMetric = getActiveSortMetric();
        return [...data].sort((a, b) => (parseFloat(b[activeSortMetric]) || 0) - (parseFloat(a[activeSortMetric]) || 0));
      }, [selectedPatient, patients, selectedGroup, selectedAlleles, selectedAntigenSources, sortMetric, patientSortMetrics]);

      // Peptides that have high-affinity binding to multiple HLA alleles
      const multiAllelePeptides = useMemo(() => {
        const peptideMap = {};
        const madConfig = activeSectionConfig.multi_allele_detection;
        for (const row of fullPatientData) {
          if (!row.peptide) continue;
          if (!peptideMap[row.peptide]) peptideMap[row.peptide] = new Set();
          let isHighAffinity;
          if (madConfig && madConfig.conditions && madConfig.conditions.length > 0) {
            isHighAffinity = madConfig.conditions.some(cond => {
              const val = row[cond.field];
              if (val === undefined || val === null) return false;
              switch (cond.operator) {
                case 'contains': return String(val).toLowerCase().includes(String(cond.value).toLowerCase());
                case 'lt': return parseFloat(val) < parseFloat(cond.value);
                case 'gt': return parseFloat(val) > parseFloat(cond.value);
                case 'lte': return parseFloat(val) <= parseFloat(cond.value);
                case 'gte': return parseFloat(val) >= parseFloat(cond.value);
                case 'eq': return String(val) === String(cond.value);
                case 'neq': return String(val) !== String(cond.value);
                default: return false;
              }
            });
          } else {
            continue; // No multi-allele detection without config
          }
          if (isHighAffinity) peptideMap[row.peptide].add(row.allele);
        }
        return new Set(
          Object.entries(peptideMap)
            .filter(([_, alleles]) => alleles.size > 1)
            .map(([peptide]) => peptide)
        );
      }, [fullPatientData]);

      // All patients data
      const allPatientsData = useMemo(() => {
        const allData = [];
        Object.values(patients).forEach(patient => {
          patient.data.forEach(row => { allData.push({ ...row, patientId: patient.id }); });
        });
        return allData;
      }, [patients]);

      const viewerPatients = useMemo(() => {
        const merged = {};
        // QC data provides patient IDs even when no report data is loaded
        const qcPatientIds = Object.keys(qcData?.summaries || qcData?.patients || {}).sort();
        const metaMap = bundlePatientMeta || {};
        qcPatientIds.forEach(id => {
          const meta = metaMap[id];
          merged[id] = patients[id] || {
            id, isMultiGroup: false, groups: ['default'], files: [], data: [],
            alleles: meta?.alleles || new Set(), alleleSupport: {}, antigenSources: new Set(),
            _loading: !patients[id],
            _pmhcCount: meta?.pmhcCount || 0
          };
        });
        // Loaded patients override stubs
        Object.keys(patients).forEach(id => { merged[id] = patients[id]; });
        // Bundle patient IDs fill any gaps (patients not in QC data)
        (bundlePatients || []).forEach(p => {
          if (!merged[p.id]) {
            const meta = metaMap[p.id];
            merged[p.id] = {
              id: p.id, isMultiGroup: false, groups: ['default'], files: [], data: [],
              alleles: meta?.alleles || new Set(), alleleSupport: {}, antigenSources: new Set(),
              _loading: true,
              _pmhcCount: meta?.pmhcCount || 0
            };
          } else if (merged[p.id]._loading) {
            const meta = metaMap[p.id];
            if (meta) {
              merged[p.id] = { ...merged[p.id], alleles: meta.alleles || merged[p.id].alleles, _pmhcCount: meta.pmhcCount || 0 };
            }
          }
        });
        return merged;
      }, [patients, qcData, bundlePatients, bundlePatientMeta]);

      const defaultReportSectionId = (
        reportSections.find(section => section.default)
        || reportSections.find(section =>
          !(section.renderer === 'qc_summary' || section.source === 'qc' || section.id === 'qc' || section.id === 'quality_control')
        )
        || reportSections[0]
        || DEFAULT_REPORT_TEMPLATE.sections[0]
      ).id;
      const activeGenericRows = useMemo(() => getSectionRows(activeSection), [activeSection, reportFiles, selectedPatient]);

      useEffect(() => {
        if (selectedPatient || Object.keys(viewerPatients).length === 0) return;
        setSelectedPatient(Object.keys(viewerPatients).sort()[0]);
      }, [viewerPatients, selectedPatient]);

      // Lazy-load: when user selects a different patient, decode just that patient's data
      useEffect(() => {
        if (!selectedPatient || !bundleEntries) return;
        if (patients[selectedPatient]) return; // already loaded
        const textDecoder = new TextDecoder();
        const filesMap = {};
        for (const [name, content] of Object.entries(bundleEntries)) {
          const basename = name.split('/').pop();
          if (basename === 'raft-report-bundle.json' || basename === 'manifest-groups.json' ||
              basename === 'qc-data.json' || basename === 'report-ui.json' || basename.match(/\.report-ui\.json$/)) {
            continue;
          }
          if (name.startsWith('qc/')) continue;
          if (!name.match(/\.(tsv|txt)$/i)) continue;
          const pid = inferPatientIdFromFilename(name, manifestData);
          if (pid === selectedPatient) {
            filesMap[name] = textDecoder.decode(content);
          }
        }
        if (Object.keys(filesMap).length === 0) return;
        // Parse this patient's data and replace patients state (evict previous)
        let parsed = {};
        const nextReportFiles = {};
        for (const [filename, content] of Object.entries(filesMap)) {
          const rows = parseDelimitedRows(filename, content);
          nextReportFiles[filename] = { name: filename, basename: filename.split('/').pop(), content, rows };
          parsed = parseFileContent(filename, content, parsed, manifestData);
        }
        setPatients(parsed);
        setReportFiles(nextReportFiles);
        // Set allele/source selections for the new patient
        const patient = parsed[selectedPatient];
        if (patient) {
          if (patient.isMultiGroup && patient.groups.length > 0) {
            const bestGroup = patient.groups.find(g => patient.groupData[g] && patient.groupData[g].data.length > 0) || patient.groups[0];
            setSelectedGroup(bestGroup);
            const groupData = patient.groupData[bestGroup];
            if (groupData) {
              setSelectedAlleles(new Set(groupData.alleles));
              setSelectedAntigenSources(new Set(groupData.antigenSources));
            }
          } else {
            setSelectedGroup(null);
            setSelectedAlleles(new Set(patient.alleles));
            setSelectedAntigenSources(new Set(patient.antigenSources));
          }
        }
      }, [selectedPatient]);

      const toggleAllele = (allele) => {
        const newSet = new Set(selectedAlleles);
        newSet.has(allele) ? newSet.delete(allele) : newSet.add(allele);
        setSelectedAlleles(newSet);
      };

      const toggleAntigenSource = (source) => {
        const newSet = new Set(selectedAntigenSources);
        newSet.has(source) ? newSet.delete(source) : newSet.add(source);
        setSelectedAntigenSources(newSet);
      };

      const generateReport = async (type) => {
        const patient = patients[selectedPatient];
        if (!patient) return;
        const sortMetric = getActiveSortMetric();
        const dateStr = new Date().toISOString().split('T')[0];
        const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        const fmt = (v, decimals = 2) => { const n = parseFloat(v); return isNaN(n) ? esc(v) : n.toFixed(decimals); };
        const fmtPct = (v) => { const n = parseFloat(v); return isNaN(n) ? '-' : (n * 100).toFixed(1) + '%'; };
        const fmtInt = (v) => { const n = parseFloat(v); return isNaN(n) ? '-' : n.toLocaleString(); };

        const reportSection = reportTemplate?.sections?.find(s => s.renderer === 'report' || s.renderer === 'lens_antigen_report');
        const pdfConfig = reportSection?.pdf || {};
        const templateColumns = pdfConfig.columns || reportSection?.table?.columns || [];
        const pdfSortMetric = pdfConfig.sort_metric || sortMetric;
        const reportNames = reportSection?.report_names;
        const reportName = reportTemplate?.name || 'Report';
        const isOnepage = type === 'onepage';
        const isFull = type === 'full';

        const groups = patient.isMultiGroup ? (patient.groups || []) : ['default'];
        const groupLabels = patient.groupLabels || {};

        // QC data
        const qcSummary = qcData?.summaries?.[selectedPatient];
        const qcSamples = qcSummary?.samples || [];
        const qcFiles = qcSummary?.files || {};
        // Collect QC PDFs for embedding in full report
        const allQcPdfEntries = [
          ...(qcFiles.funnel_plots || []).filter(f => f.path),
          ...(qcFiles.other_pdfs || []).filter(f => f.path),
          ...(qcFiles.igv_reports || []).filter(f => f.path),
          ...(qcFiles.cnvkit || []).filter(f => f.path),
        ];

        // Column definitions for each report type
        const onepageColumns = templateColumns.length > 0 ? templateColumns : [
          { key: 'peptide', label: 'Peptide', format: 'text' },
          { key: 'allele', label: 'Allele', format: 'text' },
          { key: 'priority_score_maximum', label: 'Priority', format: 'float' },
          { key: 'antigen_source', label: 'Source', format: 'text' },
        ];
        const fullColumns = [
          { key: 'peptide', label: 'Peptide', format: 'text' },
          { key: 'allele', label: 'Allele', format: 'text' },
          { key: 'priority_score_maximum', label: 'Priority', format: 'float' },
          { key: 'mhcflurry_2.1.1.aff', label: 'IC50 nM', format: 'float' },
          { key: 'percentile_rank', label: '%Rank', format: 'float' },
          { key: 'binding_level', label: 'Binding', format: 'text' },
          { key: 'vaf', label: 'VAF', format: 'float' },
          { key: 'ccf', label: 'CCF', format: 'float' },
          { key: 'tpm', label: 'TPM', format: 'float' },
          { key: 'antigen_source', label: 'Source', format: 'text' },
          { key: 'gene_name', label: 'Gene', format: 'text' },
        ];
        // Read columns from config (pdf.one_page.columns / pdf.full.columns) with fallback chain
        const configColumns = isOnepage
          ? (pdfConfig.one_page?.columns || pdfConfig.columns || templateColumns)
          : (pdfConfig.full?.columns || pdfConfig.columns || templateColumns);
        const columns = configColumns.length > 0 ? configColumns : (isOnepage ? onepageColumns : fullColumns);

        const formatCellValue = (col, row) => {
          let val = row[col.key];
          if (col.key === 'mhcflurry_2.1.1.aff') val = row.mhcflurry_2_1_1_aff || row['mhcflurry_2.1.1.aff'] || val;
          if (val == null || val === '') return '';
          const fmtType = col.format || 'float';
          if (fmtType === 'text') return String(val);
          if (fmtType === 'log2') { const n = parseFloat(val); return isNaN(n) ? '-' : n.toFixed(2); }
          if (fmtType === 'int') return fmtInt(val);
          if (fmtType === 'pct' || fmtType === 'pct_raw') return fmtPct(val);
          return fmt(val, 3);
        };

        const reportSlug = reportName.toLowerCase().replace(/[^a-z0-9]+/g, '_');
        const filename = `${isOnepage ? reportSlug + '_summary' : reportSlug + '_full'}_${selectedPatient}_${dateStr}.pdf`;

        try {
          const { jsPDF } = window.jspdf || {};
          if (!jsPDF) throw new Error('jsPDF not available');
          const doc = new jsPDF({ unit: 'pt', format: 'letter', orientation: 'portrait' });
          const pageW = doc.internal.pageSize.getWidth();
          const pageH = doc.internal.pageSize.getHeight();
          const m = 36;
          const cw = pageW - 2 * m;
          let y = m;
          const checkPage = (needed) => { if (y + needed > pageH - m) { doc.addPage(); y = m; } };

          // Helper: draw a table with header and rows
          const drawTable = (headers, widths, rows, opts = {}) => {
            const { fontSize = 8, headerH = 16, rowH = 13, title = null, titleSize = 12 } = opts;
            const totalW = widths.reduce((a, b) => a + b, 0);
            if (title) { checkPage(headerH + 30); doc.setFont('helvetica', 'bold'); doc.setFontSize(titleSize); doc.setTextColor(55, 65, 81); doc.text(title, m, y); y += titleSize + 2; }
            checkPage(headerH + rowH * 2);
            // Header
            doc.setFillColor(243, 244, 246); doc.rect(m, y, totalW, headerH, 'F');
            doc.setDrawColor(209, 213, 219); doc.setLineWidth(0.5); doc.rect(m, y, totalW, headerH);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(fontSize); doc.setTextColor(31, 41, 55);
            let x = m;
            headers.forEach((h, i) => {
              const align = h.align || 'left';
              doc.text(h.label, align === 'right' ? x + widths[i] - 4 : x + 4, y + headerH / 2 + fontSize / 3, { align: align === 'right' ? 'right' : 'left' });
              x += widths[i];
            });
            y += headerH;
            // Rows
            doc.setFont('helvetica', 'normal'); doc.setFontSize(fontSize); doc.setTextColor(31, 41, 55);
            rows.forEach((row, ri) => {
              checkPage(rowH + 4);
              if (ri % 2 === 0) { doc.setFillColor(249, 250, 251); doc.rect(m, y, totalW, rowH, 'F'); }
              doc.setDrawColor(229, 231, 235); doc.setLineWidth(0.3); doc.line(m, y + rowH, m + totalW, y + rowH);
              x = m;
              row.forEach((cell, ci) => {
                const align = headers[ci]?.align || 'left';
                const val = String(cell ?? '');
                // Truncate if too wide
                const maxW = widths[ci] - 8;
                let txt = val;
                while (doc.getTextWidth(txt) > maxW && txt.length > 3) txt = txt.slice(0, -1);
                if (txt !== val) txt += '…';
                doc.text(txt, align === 'right' ? x + widths[ci] - 4 : x + 4, y + rowH / 2 + fontSize / 3, { align: align === 'right' ? 'right' : 'left' });
                x += widths[ci];
              });
              y += rowH;
            });
            doc.setDrawColor(209, 213, 219); doc.setLineWidth(0.5); doc.line(m, y, m + totalW, y);
            y += 4;
          };

          // Helper: draw section title
          const sectionTitle = (text) => { checkPage(20); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(55, 65, 81); doc.text(text, m, y); y += 12; };
          const sectionSubtitle = (text) => { checkPage(16); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(107, 114, 128); doc.text(text, m, y); y += 8; };

          // Helper: render a QC PDF file as images and embed in jsPDF
          // Returns true if at least one page was rendered
          const embedQcPdf = async (fileEntry, label, addTitle = true) => {
            try {
              let pdfData;
              // Check if file content is available in qcFilesMap (bundle mode)
              if (typeof qcFilesMap === 'object' && qcFilesMap && qcFilesMap[fileEntry.path]) {
                pdfData = { data: new Uint8Array(qcFilesMap[fileEntry.path]) };
              } else {
                // Fetch from server
                const url = `${API_BASE}/api/qc-file?path=${encodeURIComponent(fileEntry.path)}`;
                const response = await fetch(url);
                if (!response.ok) return false;
                const arrayBuffer = await response.arrayBuffer();
                pdfData = { data: new Uint8Array(arrayBuffer) };
              }
              if (typeof pdfjsLib === 'undefined') return false;
              const pdf = await pdfjsLib.getDocument(pdfData).promise;
              const numPages = pdf.numPages;
              if (addTitle) {
                checkPage(30);
                sectionTitle(label || (fileEntry.tool || '').replace('lenstools_', '').replace('_funnel', ''));
              }
              for (let i = 1; i <= numPages; i++) {
                const page = await pdf.getPage(i);
                const scale = 2;
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;
                const imgData = canvas.toDataURL('image/png');
                // Calculate dimensions to fit page width with some padding
                const imgW = cw;
                const imgH = (viewport.height / viewport.width) * imgW;
                checkPage(imgH + 10);
                doc.addImage(imgData, 'PNG', m, y, imgW, imgH);
                y += imgH + 4;
              }
              return true;
            } catch (err) {
              console.warn('Failed to embed QC PDF:', fileEntry?.path, err);
              return false;
            }
          };

          // Helper: embed QC figures grouped by sample, fitting multiple per page
          const embedQcFigures = async (qcFileEntries) => {
            if (!qcFileEntries.length) return;
            if (typeof pdfjsLib === 'undefined') {
              // Fallback: just list figure names
              doc.addPage(); y = m;
              sectionTitle('QC Figures');
              qcFileEntries.forEach(f => {
                const name = (f.tool || '').replace('lenstools_', '').replace('_funnel', '') + (f.run_dir ? ' — ' + f.run_dir : '');
                checkPage(14);
                doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(107, 114, 128);
                doc.text('• ' + esc(name), m + 4, y); y += 12;
              });
              return;
            }

            // Separate PDFs from HTML (IGV) files
            const pdfFiles = qcFileEntries.filter(f => f.path && (f.path.endsWith('.pdf') || f.path.endsWith('.PDF')));
            const htmlFiles = qcFileEntries.filter(f => f.path && (f.path.endsWith('.html') || f.path.endsWith('.htm')));

            // Group by sample/run_dir
            const bySample = {};
            for (const f of pdfFiles) {
              const sample = f.run_dir || 'Unknown';
              if (!bySample[sample]) bySample[sample] = [];
              bySample[sample].push(f);
            }

            doc.addPage(); y = m;
            doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(31, 41, 55);
            doc.text('QC Figures', m, y + 12); y += 22;
