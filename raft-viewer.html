      const toolOrder = ['fastp', 'samtools_stats', 'star_map', 'qualimap_bamqc', 'qualimap_rnaseq', 'picard2_collect_rna_seq_metrics', 'bcftools_stats', 'somalier', 'seq2hla', 'salmon_quant', 'gatk4_merge_mutect_stats', 'whatshap', 'lohhla', 'parse_lohhla'];
      const sortedTools = Object.entries(sample.all_metrics || {}).sort(([a], [b]) => {
        const ai = toolOrder.indexOf(a);
        const bi = toolOrder.indexOf(b);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });
      const formatMetricName = (key) => {
        return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      };
      return (
        <div className="mt-3">
          <button onClick={() => setExpanded(!expanded)} className="flex items-center gap-1.5 text-xs font-medium text-indigo-600 hover:text-indigo-800 cursor-pointer">
            <Icon name={expanded ? 'chevron-up' : 'chevron-down'} size={14} />
            {expanded ? 'Hide' : 'Show'} All Metrics ({toolCount} tools)
          </button>
          {expanded && (
            <div className="mt-2 space-y-2 max-h-96 overflow-y-auto">
              {sortedTools.map(([tool, data]) => {
                const metrics = data.metrics || {};
                const keys = Object.keys(metrics);
                if (keys.length === 0) return null;
                return (
                  <div key={tool} className="border border-gray-200 rounded-md p-3 bg-white">
                    <div className="flex items-center gap-2 mb-2">
                      <Icon name="activity" size={14} className="text-gray-400" />
                      <div className="text-sm font-semibold text-gray-700">{data.label || tool}</div>
                      <div className="text-xs text-gray-400">{keys.length} metrics</div>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 gap-y-1.5">
                      {keys.map(key => {
                        const val = metrics[key];
                        return (
                          <div key={key} className="py-1">
                            <div className="text-xs text-gray-500 truncate" title={key}>{formatMetricName(key)}</div>
                            <div className="text-sm font-medium text-gray-800">{formatQcValue(val)}</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const QCSummaryDashboard = ({ patient, qcData }) => {
      const [showInDepth, setShowInDepth] = useState(false);
      const [selectedQcGroup, setSelectedQcGroup] = useState(null);
      useEffect(() => { setSelectedQcGroup(null); }, [patient]);
      const summary = qcData?.summaries?.[patient];
      const patientData = qcData?.patients?.[patient];

      if (!summary || (!summary.samples?.length && !summary.multi_sample?.length)) {
        return (
          <div className="bg-white rounded-lg shadow-md p-8 text-center">
            <Icon name="clipboard-check" size={48} color="#6b7280" className="mx-auto mb-4" />
            <h2 className="text-xl font-semibold text-gray-800 mb-2">No QC Data for {patient}</h2>
            <p className="text-gray-600">
              Quality control metrics are not available for this patient.
            </p>
          </div>
        );
      }

      const { groups, groups_source, shared_samples, samples, multi_sample, files } = summary;
      const hasGroups = groups && groups.length > 0;

      // Group samples and multi-sample entries by group
      const renderSampleCard = (sample) => {
        const categories = {};
        (sample.metrics || []).forEach(m => {
          if (!categories[m.category]) categories[m.category] = [];
          categories[m.category].push(m);
        });

        const typeColors = {
          'Tumor DNA': 'border-red-200 bg-red-50',
          'Tumor RNA': 'border-orange-200 bg-orange-50',
          'Normal DNA': 'border-blue-200 bg-blue-50',
          'Control RNA': 'border-green-200 bg-green-50',
        };
        const borderClass = typeColors[sample.label] || 'border-gray-200 bg-gray-50';

        return (
          <div key={sample.run_dir} className={`border rounded-lg p-4 ${borderClass}`}>
            <div className="flex items-center justify-between mb-3">
              <h4 className="font-semibold text-gray-800">{sample.label}</h4>
              <span className="text-xs text-gray-500">{sample.run_ids}</span>
            </div>
            {Object.entries(categories).map(([cat, metrics]) => (
              <div key={cat} className="mb-3 last:mb-0">
                <div className="text-xs font-medium text-gray-500 mb-1.5">{cat}</div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {metrics.map((m, i) => (
                    <div key={i} className="bg-white px-3 py-2 rounded shadow-sm">
                      <div className="text-xs text-gray-500">{m.label}</div>
                      <div className="font-semibold text-gray-800 text-sm">{formatSummaryValue(m.value, m.format)}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
            {sample.hla_typing && (
              <div className="mt-3">
                <div className="text-xs font-medium text-gray-500 mb-1.5">HLA Typing (seq2HLA)</div>
                <div className="flex flex-wrap gap-2">
                  {sample.hla_typing.map((r, i) => (
                    <div key={i} className="bg-white px-3 py-1.5 rounded shadow-sm text-sm">
                      <span className="font-medium text-gray-700">HLA-{r.locus}:</span>{' '}
                      <span className="px-1.5 py-0.5 bg-blue-100 text-blue-800 rounded text-xs font-medium">{r.allele1}</span>
                      {r.confidence1 != null && <span className="text-xs text-gray-400 ml-1">(p={r.confidence1.toFixed(2)})</span>}
                      {' / '}
                      <span className="px-1.5 py-0.5 bg-blue-100 text-blue-800 rounded text-xs font-medium">{r.allele2}</span>
                      {r.confidence2 != null && <span className="text-xs text-gray-400 ml-1">(p={r.confidence2.toFixed(2)})</span>}
                    </div>
                  ))}
                </div>
                {sample.hla_alignment?.length > 0 && (
                  <div className="mt-2 flex flex-wrap gap-2">
                    {sample.hla_alignment.map((a, i) => (
                      <div key={i} className="bg-white px-3 py-1.5 rounded shadow-sm text-xs text-gray-600">
                        <span className="font-medium">{a.file.includes('ClassI') ? 'Class I' : a.file.includes('ClassII') ? 'Class II' : 'Alignment'}:</span>{' '}
                        {a.reads_processed?.toLocaleString()} reads, {a.alignment_rate}% aligned ({a.reads_aligned?.toLocaleString()} reads)
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
            {/* Whatshap for single samples (germline phasing) */}
            {sample.whatshap?.stats?.length > 0 && (() => {
              const allSummary = sample.whatshap.stats.find(s => s.summary?.chromosome === 'ALL');
              if (!allSummary) return null;
              const s = allSummary.summary;
              return (
                <div className="mt-3">
                  <div className="text-xs font-medium text-gray-500 mb-1.5">Germline Phasing (WhatsHap)</div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                    {['variants', 'phased', 'blocks'].map(key => s[key] !== undefined && (
                      <div key={key} className="bg-white px-3 py-2 rounded shadow-sm">
                        <div className="text-xs text-gray-500">{key}</div>
                        <div className="font-semibold text-gray-800 text-sm">{formatQcValue(s[key])}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}
            {sample.salmon_gene_tpm && (() => {
              const geneTpm = sample.salmon_gene_tpm;
              const sortedGenes = Object.entries(geneTpm).sort((a, b) => b[1] - a[1]);
              const topGenes = sortedGenes.slice(0, 10);
              const expressedCount = sortedGenes.filter(([, v]) => v > 0).length;
              const totalGenes = sortedGenes.length;
              const totalTpm = sortedGenes.reduce((s, [, v]) => s + v, 0);
              return (
                <div className="mt-3">
                  <div className="text-xs font-medium text-gray-500 mb-1.5">Gene Expression (Salmon)</div>
                  <div className="grid grid-cols-3 gap-2 mb-2">
                    <div className="bg-white px-3 py-2 rounded shadow-sm">
                      <div className="text-xs text-gray-500">Total Genes</div>
                      <div className="font-semibold text-gray-800 text-sm">{totalGenes.toLocaleString()}</div>
                    </div>
                    <div className="bg-white px-3 py-2 rounded shadow-sm">
                      <div className="text-xs text-gray-500">Expressed</div>
                      <div className="font-semibold text-gray-800 text-sm">{expressedCount.toLocaleString()}</div>
                    </div>
                    <div className="bg-white px-3 py-2 rounded shadow-sm">
                      <div className="text-xs text-gray-500">Total TPM</div>
                      <div className="font-semibold text-gray-800 text-sm">{formatQcValue(totalTpm)}</div>
                    </div>
                  </div>
                  <div className="bg-white rounded shadow-sm p-2">
                    <div className="text-xs text-gray-400 mb-1">Top 10 by TPM</div>
                    <div className="flex flex-wrap gap-x-3 gap-y-1">
                      {topGenes.map(([gene, tpm]) => (
                        <span key={gene} className="text-xs">
                          <span className="font-medium text-gray-700">{gene}</span>
                          <span className="text-gray-400 ml-1">{tpm.toFixed(1)}</span>
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              );
            })()}
            {sample.all_metrics && Object.keys(sample.all_metrics).length > 0 && (
              <ExpandableQcMetrics sample={sample} />
            )}
          </div>
        );
      };

      const renderMultiSampleCard = (ms) => {
        const categories = {};
        (ms.metrics || []).forEach(m => {
          if (!categories[m.category]) categories[m.category] = [];
          categories[m.category].push(m);
        });

        return (
          <div key={ms.run_dir} className="border border-purple-200 bg-purple-50 rounded-lg p-4">
            <div className="flex items-center justify-between mb-3">
              <h4 className="font-semibold text-gray-800 flex items-center gap-2">
                <Icon name="layers" size={16} className="text-purple-600" />
                {ms.label}
              </h4>
              <span className="text-xs text-gray-500">{ms.run_ids}</span>
            </div>

            {Object.keys(categories).length > 0 && Object.entries(categories).map(([cat, metrics]) => (
              <div key={cat} className="mb-3">
                <div className="text-xs font-medium text-gray-500 mb-1.5">{cat}</div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {metrics.map((m, i) => (
                    <div key={i} className="bg-white px-3 py-2 rounded shadow-sm">
                      <div className="text-xs text-gray-500">{m.label}</div>
                      <div className="font-semibold text-gray-800 text-sm">{formatSummaryValue(m.value, m.format)}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}

            {/* Somalier */}
            {ms.somalier?.pairs?.length > 0 && (
              <div className="mb-3">
                <div className="text-xs font-medium text-gray-500 mb-1.5">Sample Validation (Somalier)</div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {ms.somalier.pairs.map((p, i) => (
                    <div key={i} className="bg-white px-3 py-2 rounded shadow-sm text-sm">
                      <div className="text-xs text-gray-500">
                        {p.sample_a?.split('-').pop()} vs {p.sample_b?.split('-').pop()}
                      </div>
                      <span className={`font-semibold ${p.relatedness >= 0.9 ? 'text-green-700' : p.relatedness >= 0.5 ? 'text-yellow-700' : 'text-red-700'}`}>
                        {formatQcValue(p.relatedness)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Whatshap summary */}
            {ms.whatshap?.stats?.length > 0 && (() => {
              const allSummary = ms.whatshap.stats.find(s => s.summary?.chromosome === 'ALL');
              if (!allSummary) return null;
              const s = allSummary.summary;
              return (
                <div className="mb-3">
                  <div className="text-xs font-medium text-gray-500 mb-1.5">Phasing (WhatsHap)</div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                    {['variants', 'phased', 'blocks'].map(key => s[key] !== undefined && (
                      <div key={key} className="bg-white px-3 py-2 rounded shadow-sm">
                        <div className="text-xs text-gray-500">{key}</div>
                        <div className="font-semibold text-gray-800 text-sm">{formatQcValue(s[key])}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* LOHHLA */}
            {ms.parse_lohhla?.length > 0 && (
              <div className="mb-3">
                <div className="text-xs font-medium text-gray-500 mb-1.5">HLA Loss (LOHHLA)</div>
                <div className="flex flex-wrap gap-2">
                  {ms.parse_lohhla.map((r, i) => (
                    <div key={i} className="flex items-center gap-2 bg-white px-3 py-1.5 rounded shadow-sm">
                      <span className="font-medium text-sm">{r.allele}</span>
                      <span className={`text-xs px-2 py-0.5 rounded ${r.lohhla_allele_loss_pval < 0.05 ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`}>
                        p = {formatQcValue(r.lohhla_allele_loss_pval)}
                      </span>
                      {r.lohhla_allele_loss_pval < 0.05 && (
                        <span className="text-xs text-red-600 font-medium">LOH</span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {ms.lohhla?.predictions?.length > 0 && !ms.parse_lohhla?.length && (
              <div className="mb-3">
                <div className="text-xs font-medium text-gray-500 mb-1.5">HLA Loss Predictions</div>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs border-collapse">
                    <thead>
                      <tr className="bg-white">
                        {['HLA Type 1', 'HLA Type 2', 'Copy# T1', 'Copy# T2', 'P-Value', 'Loss', 'Kept'].map(col => (
                          <th key={col} className="py-1 px-2 text-left font-medium border-b">{col}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {ms.lohhla.predictions.map((r, i) => (
                        <tr key={i} className="border-b">
                          <td className="py-1 px-2">{r.HLA_A_type1}</td>
                          <td className="py-1 px-2">{r.HLA_A_type2}</td>
                          <td className="py-1 px-2">{formatQcValue(r.HLA_type1copyNum_withBAF)}</td>
                          <td className="py-1 px-2">{formatQcValue(r.HLA_type2copyNum_withBAF)}</td>
                          <td className="py-1 px-2">
                            <span className={`px-1 py-0.5 rounded text-xs ${r.PVal_unique < 0.05 ? 'bg-red-100 text-red-800' : ''}`}>
                              {formatQcValue(r.PVal_unique)}
                            </span>
                          </td>
                          <td className="py-1 px-2 text-red-700">{r.LossAllele}</td>
                          <td className="py-1 px-2 text-green-700">{r.KeptAllele}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
        );
      };

      // Render files section (filtered by active group if applicable)
      const renderFilesSection = () => {
        const filterByGroup = (fileList) => {
          if (!hasGroups || !activeQcGroup) return fileList || [];
          return (fileList || []).filter(f => f.group === activeQcGroup || !f.group);
        };
        const funnel_plots = filterByGroup(files.funnel_plots);
        const cnvkit = filterByGroup(files.cnvkit);
        const igv_reports = filterByGroup(files.igv_reports);
        const other_pdfs = filterByGroup(files.other_pdfs);
        const hasFiles = funnel_plots.length || cnvkit.length || igv_reports.length || other_pdfs.length;
        if (!hasFiles) return null;

        return (
          <div className="bg-white rounded-lg shadow-md p-6">
            <h3 className="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
              <Icon name="file" size={20} />
              Reports & Figures
            </h3>

            {funnel_plots.length > 0 && (
              <div className="mb-4">
                <h4 className="text-sm font-medium text-gray-700 mb-2">Funnel Plots</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {funnel_plots.map((f, i) => (
                    <div key={i}>
                      <div className="text-xs text-gray-500 mb-1">{f.tool.replace('lenstools_', '').replace('_funnel', '')} - {f.run_dir}</div>
                      <iframe
                        src={getQcFileUrl(f.path)}
                        className="w-full border border-gray-200 rounded"
                        style={{ height: '400px' }}
                        title={f.name}
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {cnvkit.length > 0 && (
              <div className="mb-4">
                <h4 className="text-sm font-medium text-gray-700 mb-2">CNVkit</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {cnvkit.map((f, i) => (
                    <div key={i}>
                      <div className="text-xs text-gray-500 mb-1">{f.tool.replace('cnvkit_', '')} - {f.run_dir}</div>
                      <iframe
                        src={getQcFileUrl(f.path)}
                        className="w-full border border-gray-200 rounded"
                        style={{ height: '400px' }}
                        title={f.name}
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {igv_reports.length > 0 && (
              <div className="mb-4">
                <h4 className="text-sm font-medium text-gray-700 mb-2">IGV Reports</h4>
                {igv_reports.map((f, i) => (
                  <a key={i}
                    href={getQcFileUrl(f.path)}
                    target="_blank" rel="noopener noreferrer"
                    className="inline-flex items-center gap-2 text-sm text-indigo-600 hover:text-indigo-800 underline mr-4"
                  >
                    <Icon name="external-link" size={14} />
                    {f.name} ({f.run_dir})
                  </a>
                ))}
              </div>
            )}

            {other_pdfs.length > 0 && (
              <div className="mb-4">
                <h4 className="text-sm font-medium text-gray-700 mb-2">Other PDFs</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {other_pdfs.map((f, i) => (
                    <div key={i}>
                      <div className="text-xs text-gray-500 mb-1">{f.tool} - {f.run_dir}</div>
                      <iframe
                        src={getQcFileUrl(f.path)}
                        className="w-full border border-gray-200 rounded"
                        style={{ height: '400px' }}
                        title={f.name}
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      };

      // Render grouped or ungrouped view
      const sharedSamples = hasGroups ? samples.filter(s => !s.group) : [];
      const activeQcGroup = selectedQcGroup || (hasGroups ? groups[0]?.id : null);

      const renderContent = () => {
        if (hasGroups && activeQcGroup) {
          const group = groups.find(g => g.id === activeQcGroup);
          if (!group) return null;
          const groupSamples = samples.filter(s => s.group === group.id);
          const groupMulti = multi_sample.filter(ms => ms.group === group.id);
          return (
            <div className="space-y-3">
              {groupSamples.map(renderSampleCard)}
              {sharedSamples.map(renderSampleCard)}
              {groupMulti.map(renderMultiSampleCard)}
            </div>
          );
        }
        return (
          <div className="space-y-3">
            {samples.map(renderSampleCard)}
            {multi_sample.map(renderMultiSampleCard)}
          </div>
        );
      };

      return (
        <div className="space-y-4">
          {/* Warning banner for inferred groups */}
          {groups_source === 'inferred' && (
            <div className="bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 flex items-center gap-2">
              <Icon name="alert-triangle" size={18} className="text-amber-600 flex-shrink-0" />
              <span className="text-sm text-amber-800">
                Groups were auto-detected from file names. Load a manifest for definitive grouping.
              </span>
            </div>
          )}
          {/* Group sub-tabs for QC */}
          {hasGroups && groups.length > 1 && (
            <div className="flex flex-wrap gap-1 bg-gray-100 p-1 rounded-lg">
              {groups.map(group => {
                const groupSampleCount = samples.filter(s => s.group === group.id).length + sharedSamples.length;
                const groupMultiCount = multi_sample.filter(ms => ms.group === group.id).length;
                return (
                  <button
                    key={group.id}
                    onClick={() => setSelectedQcGroup(group.id)}
                    className={`px-3 py-1.5 text-sm font-medium rounded-md transition ${
                      activeQcGroup === group.id
                        ? 'bg-white text-emerald-700 shadow-sm'
                        : 'text-gray-600 hover:text-gray-800'
                    }`}
                  >
                    <Icon name="folder" size={14} className="inline mr-1" />
                    {group.label}
                    <span className="text-xs text-gray-400 ml-1">
                      ({groupSampleCount + groupMultiCount})
                    </span>
                  </button>
                );
              })}
            </div>
          )}
          <div className="bg-white rounded-lg shadow-md p-6">
            <h2 className="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
              <Icon name="clipboard-check" size={24} />
              Quality Control: {patient}
            </h2>
            {renderContent()}
          </div>

          {renderFilesSection()}

          {/* In-Depth Tool Outputs */}
          {patientData && (
            <div className="bg-white rounded-lg shadow-md">
              <button
                onClick={() => setShowInDepth(!showInDepth)}
                className="w-full p-4 flex items-center justify-between text-left hover:bg-gray-50 transition rounded-lg"
              >
                <span className="font-semibold text-gray-700 flex items-center gap-2">
                  <Icon name="code" size={18} />
                  In-Depth Tool Outputs
                </span>
                <Icon name={showInDepth ? 'chevron-up' : 'chevron-down'} size={20} className="text-gray-500" />
              </button>
              {showInDepth && (
                <div className="p-4 pt-0 border-t border-gray-200">
                  <PatientQCView patient={patient} qcData={qcData} />
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // Patient QC View Component (raw tool-level display, used in In-Depth section)
    const PatientQCView = ({ patient, qcData }) => {
      const patientData = qcData?.patients?.[patient];

      if (!patientData || Object.keys(patientData).length === 0) {
        return (
          <div className="bg-white rounded-lg shadow-md p-8 text-center">
            <Icon name="clipboard-check" size={48} color="#6b7280" className="mx-auto mb-4" />
            <h2 className="text-xl font-semibold text-gray-800 mb-2">No QC Data for {patient}</h2>
            <p className="text-gray-600">
              Quality control metrics are not available for this patient.
              <br />
              Check that QC files exist in <code className="bg-gray-100 px-1 rounded">outputs/qc/*/</code>
            </p>
          </div>
        );
      }

      // Organize run directories by type: single-sample vs multi-sample
      const runDirs = Object.keys(patientData).sort((a, b) => {
        // Sort single-sample first, then multi-sample
        const aMulti = a.includes('+');
        const bMulti = b.includes('+');
        if (aMulti !== bMulti) return aMulti ? 1 : -1;
        return a.localeCompare(b);
      });

      return (
        <div className="space-y-4">
          <div>
            <p className="text-sm text-gray-500 mb-4">
              {runDirs.length} sample group{runDirs.length !== 1 ? 's' : ''} with QC data
            </p>

            {runDirs.map(runDir => {
              const tools = patientData[runDir];
              const toolNames = Object.keys(tools).sort();
              const isMultiSample = runDir.includes('+');
              const prefixMap = { ad: 'Tumor DNA', ar: 'Tumor RNA', nd: 'Normal DNA', nr: 'Control RNA' };
              const humanLabel = runDir.split('+').map(part => {
                const prefix = part.split('-')[0];
                return prefixMap[prefix] || part;
              }).join(' + ');

              return (
                <div key={runDir} className="mb-6">
                  <div className="flex items-center gap-2 mb-3 pb-2 border-b border-gray-200">
                    <Icon name={isMultiSample ? 'layers' : 'file'} size={16} className="text-gray-600" />
                    <span className="font-medium text-gray-800">{humanLabel}</span>
                    <span className="text-xs text-gray-400">{runDir}</span>
                    <span className="text-xs text-gray-500 ml-auto">{toolNames.length} tools</span>
                  </div>
                  <div className="space-y-2 ml-2">
                    {toolNames.map(toolName => (
                      <QCToolSection
                        key={toolName}
                        toolName={toolName}
                        toolData={tools[toolName]}
                        patientId={patient}
                      />
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // Error Boundary for Joint Analysis (prevents blank page on crash)
    class JointErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="bg-white rounded-lg shadow-md p-8 text-center">
              <Icon name="alert-triangle" size={48} color="#ef4444" className="mx-auto mb-4" />
              <h2 className="text-xl font-semibold text-gray-800 mb-2">Joint Analysis Error</h2>
              <p className="text-gray-600 mb-4">Something went wrong rendering the Joint Analysis panel.</p>
              <details className="text-left text-sm text-gray-500 bg-gray-50 rounded p-4">
                <summary className="cursor-pointer font-medium">Error Details</summary>
                <pre className="mt-2 whitespace-pre-wrap">{this.state.error?.message || 'Unknown error'}</pre>
              </details>
              <button onClick={() => this.setState({ hasError: false, error: null })} className="mt-4 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                Try Again
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Joint Analysis Panel Component (for multi-group patients)
    const JointAnalysisPanel = ({ patient, qcData, orderedGroups, onGenerateJointReport }) => {
      const [activeSection, setActiveSection] = useState('sharedness');

      if (!patient || !patient.isMultiGroup || !patient.groups || patient.groups.length < 2) {
        return (
          <div className="bg-white rounded-lg shadow-md p-8 text-center">
            <Icon name="git-compare" size={48} color="#6b7280" className="mx-auto mb-4" />
            <h2 className="text-xl font-semibold text-gray-800 mb-2">Joint Analysis Not Available</h2>
            <p className="text-gray-600">
              Joint analysis requires a patient with multiple groups/timepoints.
            </p>
          </div>
        );
      }

      // Use orderedGroups if populated, fall back to patient.groups
      const groups = (orderedGroups && orderedGroups.length >= 2) ? orderedGroups : patient.groups;

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-lg shadow-md p-6">
            <h2 className="text-xl font-semibold text-gray-800 mb-2 flex items-center gap-2">
              <Icon name="git-compare" size={24} />
              Joint Analysis: {patient.id}
            </h2>
            <p className="text-sm text-gray-600 mb-4">
              Comparing {groups.length} groups: {groups.join(' → ')}
            </p>
            {onGenerateJointReport && (
              <button
                onClick={onGenerateJointReport}
                className="px-4 py-2 bg-indigo-600 text-white rounded-md text-sm font-medium flex items-center gap-2 hover:bg-indigo-700 transition mb-4"
              >
                📑 Joint Analysis Report
              </button>
            )}

            {/* Section tabs */}
            <div className="flex flex-wrap gap-2 border-b border-gray-200 pb-4 mb-6">
              {[
                { id: 'sharedness', label: 'pMHC Sharedness', icon: 'layers' },
                { id: 'expression', label: 'Expression Changes', icon: 'trending-up' },
                { id: 'gainloss', label: 'Gained/Lost Antigens', icon: 'arrow-left-right' },
                { id: 'allelic', label: 'Allelic Consistency', icon: 'shield-check' }
              ].map(section => (
                <button
                  key={section.id}
                  onClick={() => setActiveSection(section.id)}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 ${
                    activeSection === section.id
                      ? 'bg-purple-600 text-white'
                      : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                  }`}
                >
                  <Icon name={section.icon} size={16} />
                  {section.label}
                </button>
              ))}
            </div>

            {/* Section content */}
            {activeSection === 'sharedness' && <VennDiagramSection patient={patient} groups={groups} />}
            {activeSection === 'expression' && <ExpressionComparisonSection patient={patient} qcData={qcData} groups={groups} />}
            {activeSection === 'gainloss' && <GainedLostSection patient={patient} groups={groups} />}
            {activeSection === 'allelic' && <AllelicConsistencySection patient={patient} groups={groups} />}
          </div>
        </div>
      );
    };

    // Venn Diagram Section - pMHC Sharedness
    const VennDiagramSection = ({ patient, groups }) => {

      const analysis = useMemo(() => {
        // Build peptide-allele sets for each group
        const peptideSets = {};
        groups.forEach(group => {
          peptideSets[group] = new Set(
            (patient.groupData[group]?.data || []).map(row => `${row.peptide}|${row.allele}`)
          );
        });

        // For 2 groups, compute intersection and exclusive sets
        if (groups.length === 2) {
          const [g1, g2] = groups;
          const set1 = peptideSets[g1];
          const set2 = peptideSets[g2];

          const shared = new Set([...set1].filter(x => set2.has(x)));
          const exclusive1 = new Set([...set1].filter(x => !set2.has(x)));
          const exclusive2 = new Set([...set2].filter(x => !set1.has(x)));

          return { peptideSets, shared, exclusive: { [g1]: exclusive1, [g2]: exclusive2 } };
        }

        // For >2 groups, compute all shared (intersection of all)
        const allSets = Object.values(peptideSets);
        const shared = new Set([...allSets[0]].filter(x => allSets.every(s => s.has(x))));
        const exclusive = {};
        groups.forEach(group => {
          exclusive[group] = new Set([...peptideSets[group]].filter(x => !shared.has(x)));
        });

        return { peptideSets, shared, exclusive };
      }, [patient, groups]);

      return (
        <div>
          <h3 className="text-lg font-semibold text-gray-800 mb-4">pMHC Sharedness Across Groups</h3>

          {/* Summary stats */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div className="bg-purple-50 border border-purple-200 rounded-lg p-4 text-center">
              <div className="text-3xl font-bold text-purple-700">{analysis.shared.size}</div>
              <div className="text-sm text-purple-600">Shared pMHCs</div>
              <div className="text-xs text-purple-500 mt-1">Present in all groups</div>
            </div>
            {groups.map(group => (
              <div key={group} className="bg-gray-50 border border-gray-200 rounded-lg p-4 text-center">
                <div className="text-3xl font-bold text-gray-700">{analysis.exclusive[group].size}</div>
                <div className="text-sm text-gray-600">Exclusive to {group}</div>
                <div className="text-xs text-gray-500 mt-1">Total: {analysis.peptideSets[group].size}</div>
              </div>
            ))}
          </div>

          {/* Simple Venn-like visualization for 2 groups */}
          {groups.length === 2 && (
            <div className="flex justify-center items-center gap-0 my-8">
              <div className="w-40 h-40 rounded-full bg-blue-100 border-2 border-blue-400 flex items-center justify-center -mr-12 z-10">
                <div className="text-center -ml-8">
                  <div className="text-2xl font-bold text-blue-700">{analysis.exclusive[groups[0]].size}</div>
                  <div className="text-xs text-blue-600">{groups[0]} only</div>
                </div>
              </div>
              <div className="w-24 h-40 flex items-center justify-center z-20">
                <div className="text-center bg-purple-200 px-4 py-2 rounded-lg">
                  <div className="text-2xl font-bold text-purple-700">{analysis.shared.size}</div>
                  <div className="text-xs text-purple-600">Shared</div>
                </div>
              </div>
              <div className="w-40 h-40 rounded-full bg-green-100 border-2 border-green-400 flex items-center justify-center -ml-12 z-10">
                <div className="text-center -mr-8">
                  <div className="text-2xl font-bold text-green-700">{analysis.exclusive[groups[1]].size}</div>
                  <div className="text-xs text-green-600">{groups[1]} only</div>
                </div>
              </div>
            </div>
          )}

          {/* Detailed table */}
          <div className="bg-gray-50 rounded-lg p-4 max-h-64 overflow-y-auto">
            <h4 className="text-sm font-semibold text-gray-700 mb-2">Shared pMHCs ({analysis.shared.size})</h4>
            {analysis.shared.size > 0 ? (
              <div className="flex flex-wrap gap-2">
                {[...analysis.shared].slice(0, 50).map(key => {
                  const [peptide, allele] = key.split('|');
                  return (
                    <span key={key} className="px-2 py-1 bg-purple-100 text-purple-800 rounded text-xs font-mono">
                      {peptide} ({allele})
                    </span>
                  );
                })}
                {analysis.shared.size > 50 && (
                  <span className="px-2 py-1 bg-gray-200 text-gray-600 rounded text-xs">
                    +{analysis.shared.size - 50} more
                  </span>
                )}
              </div>
            ) : (
              <p className="text-sm text-gray-500">No shared pMHCs between groups.</p>
            )}
          </div>
        </div>
      );
    };

    // Expression Comparison Section
    const ExpressionComparisonSection = ({ patient, qcData, groups }) => {

      // Build pairwise comparisons for consecutive groups
      const pairComparisons = useMemo(() => {
        if (groups.length < 2) return [];

        const pairs = [];
        for (let i = 0; i < groups.length - 1; i++) {
          const g1 = groups[i], g2 = groups[i + 1];
          let geneTPM1, geneTPM2;
          let dataSource = 'lens';

          // Try Salmon quant.sf gene-level TPMs from QC summaries
          const summary = qcData?.summaries?.[patient.id];
          if (summary?.samples) {
            let salmon1 = null, salmon2 = null;
            for (const sample of summary.samples) {
              if (sample.salmon_gene_tpm && sample.run_dir?.startsWith('ar-')) {
                if (sample.group === g1) salmon1 = sample.salmon_gene_tpm;
                if (sample.group === g2) salmon2 = sample.salmon_gene_tpm;
              }
            }
            if (salmon1 && salmon2) {
              geneTPM1 = new Map(Object.entries(salmon1));
              geneTPM2 = new Map(Object.entries(salmon2));
              dataSource = 'salmon';
            }
          }

          // Fall back to LENS TPM if no Salmon data
          if (!geneTPM1) {
            const data1 = patient.groupData[g1]?.data || [];
            const data2 = patient.groupData[g2]?.data || [];
            geneTPM1 = new Map();
            data1.forEach(row => {
              const gene = row.gene_name;
              const tpm = parseFloat(row.gene_tpm || row.tpm) || 0;
              if (!geneTPM1.has(gene) || tpm > geneTPM1.get(gene)) geneTPM1.set(gene, tpm);
            });
            geneTPM2 = new Map();
            data2.forEach(row => {
              const gene = row.gene_name;
              const tpm = parseFloat(row.gene_tpm || row.tpm) || 0;
              if (!geneTPM2.has(gene) || tpm > geneTPM2.get(gene)) geneTPM2.set(gene, tpm);
            });
          }

          const compared = [];
          geneTPM1.forEach((tpm1, gene) => {
            const tpm2 = geneTPM2.get(gene);
            if (tpm2 !== undefined) {
              const log2fc = (tpm1 > 0 && tpm2 > 0) ? Math.log2(tpm2 / tpm1) : 0;
              compared.push({ gene, tpm1, tpm2, log2fc });
            }
          });
          compared.sort((a, b) => Math.abs(b.log2fc) - Math.abs(a.log2fc));

          const hasExpression = compared.some(c => c.tpm1 > 0 || c.tpm2 > 0);
          pairs.push({ data: compared, hasExpression, g1, g2, dataSource });
        }
        return pairs;
      }, [patient, groups, qcData]);

      if (pairComparisons.length === 0 || !pairComparisons.some(p => p.hasExpression)) {
        return (
          <div className="text-center py-8">
            <Icon name="bar-chart-2" size={48} color="#9ca3af" className="mx-auto mb-4" />
            <p className="text-gray-500">No expression data available for comparison.</p>
          </div>
        );
      }

      return (
        <div className="space-y-8">
          {pairComparisons.map((comparison, pairIdx) => (
            <div key={`${comparison.g1}-${comparison.g2}`}>
              <h3 className="text-lg font-semibold text-gray-800 mb-4">
                Expression Changes ({comparison.g1} → {comparison.g2})
                {comparison.dataSource === 'salmon' ? (
                  <span className="ml-2 text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-normal">
                    Salmon quant.sf ({comparison.data.length.toLocaleString()} genes)
                  </span>
                ) : (
                  <span className="ml-2 text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-normal">
                    LENS TPM
                  </span>
                )}
              </h3>

              <div className="grid grid-cols-3 gap-4 mb-6">
                <div className="bg-red-50 border border-red-200 rounded-lg p-4 text-center">
                  <div className="text-2xl font-bold text-red-700">
                    {comparison.data.filter(d => d.log2fc < -1).length}
                  </div>
                  <div className="text-sm text-red-600">Downregulated</div>
                  <div className="text-xs text-red-500">(log2FC &lt; -1)</div>
                </div>
                <div className="bg-gray-50 border border-gray-200 rounded-lg p-4 text-center">
                  <div className="text-2xl font-bold text-gray-700">
                    {comparison.data.filter(d => d.log2fc >= -1 && d.log2fc <= 1).length}
                  </div>
                  <div className="text-sm text-gray-600">Stable</div>
                  <div className="text-xs text-gray-500">(|log2FC| ≤ 1)</div>
                </div>
                <div className="bg-green-50 border border-green-200 rounded-lg p-4 text-center">
                  <div className="text-2xl font-bold text-green-700">
                    {comparison.data.filter(d => d.log2fc > 1).length}
                  </div>
                  <div className="text-sm text-green-600">Upregulated</div>
                  <div className="text-xs text-green-500">(log2FC &gt; 1)</div>
                </div>
              </div>

              <div className="bg-gray-50 rounded-lg p-4 max-h-80 overflow-y-auto">
                <h4 className="text-sm font-semibold text-gray-700 mb-3">Top Expression Changes</h4>
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-gray-300">
                      <th className="text-left py-2">Gene</th>
                      <th className="text-right py-2">{comparison.g1} TPM</th>
                      <th className="text-right py-2">{comparison.g2} TPM</th>
                      <th className="text-right py-2">Log2 FC</th>
                    </tr>
                  </thead>
                  <tbody>
                    {comparison.data.slice(0, 20).map((row, idx) => (
                      <tr key={idx} className="border-b border-gray-200">
                        <td className="py-2 font-mono text-xs">{row.gene}</td>
                        <td className="py-2 text-right">{row.tpm1.toFixed(2)}</td>
                        <td className="py-2 text-right">{row.tpm2.toFixed(2)}</td>
                        <td className={`py-2 text-right font-semibold ${row.log2fc > 1 ? 'text-green-600' : row.log2fc < -1 ? 'text-red-600' : 'text-gray-600'}`}>
                          {row.log2fc.toFixed(2)}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {pairIdx < pairComparisons.length - 1 && (
                <hr className="my-6 border-gray-200" />
              )}
            </div>
          ))}
        </div>
      );
    };

    // Gained/Lost Antigens Section
    const GainedLostSection = ({ patient, groups }) => {

      // Build pairwise analyses for consecutive groups
      const pairAnalyses = useMemo(() => {
        if (groups.length < 2) return [];

        const pairs = [];
        for (let i = 0; i < groups.length - 1; i++) {
          const g1 = groups[i], g2 = groups[i + 1];
          const peptides1 = new Set((patient.groupData[g1]?.data || []).map(r => r.peptide));
          const peptides2 = new Set((patient.groupData[g2]?.data || []).map(r => r.peptide));

          const gained = [...peptides2].filter(p => !peptides1.has(p)).sort();
          const lost = [...peptides1].filter(p => !peptides2.has(p)).sort();
          const retained = [...peptides1].filter(p => peptides2.has(p)).sort();

          pairs.push({ gained, lost, retained, g1, g2 });
        }
        return pairs;
      }, [patient, groups]);

      if (pairAnalyses.length === 0) return null;

      return (
        <div className="space-y-8">
          {pairAnalyses.map((analysis, pairIdx) => (
            <div key={`${analysis.g1}-${analysis.g2}`}>
              <h3 className="text-lg font-semibold text-gray-800 mb-4">Antigen Changes ({analysis.g1} → {analysis.g2})</h3>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                {/* Lost */}
                <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                  <div className="flex items-center gap-2 mb-3">
                    <Icon name="minus-circle" size={20} className="text-red-600" />
                    <span className="font-semibold text-red-800">Lost Antigens</span>
                    <span className="ml-auto text-2xl font-bold text-red-700">{analysis.lost.length}</span>
                  </div>
                  <div className="max-h-60 overflow-y-auto">
                    {analysis.lost.length > 0 ? (
                      <div className="space-y-0.5">
                        {analysis.lost.map(p => (
                          <div key={p} className="text-xs font-mono text-red-700">{p}</div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-sm text-red-400">No antigens lost</p>
                    )}
                  </div>
                </div>

                {/* Retained */}
                <div className="bg-gray-50 border border-gray-200 rounded-lg p-4">
                  <div className="flex items-center gap-2 mb-3">
                    <Icon name="check-circle" size={20} className="text-gray-600" />
                    <span className="font-semibold text-gray-800">Retained</span>
                    <span className="ml-auto text-2xl font-bold text-gray-700">{analysis.retained.length}</span>
                  </div>
                  <div className="max-h-60 overflow-y-auto">
                    {analysis.retained.length > 0 ? (
                      <div className="space-y-0.5">
                        {analysis.retained.map(p => (
                          <div key={p} className="text-xs font-mono text-gray-700">{p}</div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-sm text-gray-500">No shared antigens</p>
                    )}
                  </div>
                </div>

                {/* Gained */}
                <div className="bg-green-50 border border-green-200 rounded-lg p-4">
                  <div className="flex items-center gap-2 mb-3">
                    <Icon name="plus-circle" size={20} className="text-green-600" />
                    <span className="font-semibold text-green-800">Gained Antigens</span>
                    <span className="ml-auto text-2xl font-bold text-green-700">{analysis.gained.length}</span>
                  </div>
                  <div className="max-h-60 overflow-y-auto">
                    {analysis.gained.length > 0 ? (
                      <div className="space-y-0.5">
                        {analysis.gained.map(p => (
                          <div key={p} className="text-xs font-mono text-green-700">{p}</div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-sm text-green-400">No new antigens gained</p>
                    )}
                  </div>
                </div>
              </div>

              {pairIdx < pairAnalyses.length - 1 && (
                <hr className="my-6 border-gray-200" />
              )}
            </div>
          ))}
        </div>
      );
    };

    // Allelic Consistency Section (LOH Detection)
    const AllelicConsistencySection = ({ patient, groups }) => {

      const analysis = useMemo(() => {
        // Collect alleles from each group
        const allelesByGroup = {};
        groups.forEach(group => {
          allelesByGroup[group] = patient.groupData[group]?.alleles || new Set();
        });

        // Find all unique alleles
        const allAlleles = new Set();
        Object.values(allelesByGroup).forEach(set => {
          set.forEach(a => allAlleles.add(a));
        });

        // Categorize alleles
        const consistent = [];
        const potentialLOH = [];

        allAlleles.forEach(allele => {
          const presentIn = groups.filter(g => allelesByGroup[g].has(allele));
          if (presentIn.length === groups.length) {
            consistent.push({ allele, status: 'present' });
          } else {
            potentialLOH.push({
              allele,
              presentIn,
              absentIn: groups.filter(g => !allelesByGroup[g].has(allele))
            });
          }
        });

        return { consistent, potentialLOH, allelesByGroup, groups };
      }, [patient, groups]);

      return (
        <div>
          <h3 className="text-lg font-semibold text-gray-800 mb-4">Allelic Consistency Check</h3>

          {/* Alert for potential LOH */}
          {analysis.potentialLOH.length > 0 ? (
            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
              <div className="flex items-center gap-2 mb-2">
                <Icon name="alert-triangle" size={20} className="text-yellow-600" />
                <h4 className="font-semibold text-yellow-800">Potential Loss of Heterozygosity Detected</h4>
              </div>
              <p className="text-sm text-yellow-700 mb-3">
                The following HLA alleles show inconsistent presence across groups, which may indicate LOH:
              </p>
              <div className="space-y-2">
                {analysis.potentialLOH.map(({ allele, presentIn, absentIn }) => (
                  <div key={allele} className="flex items-center gap-2 text-sm">
                    <span className="font-mono font-semibold text-yellow-900">{allele}</span>
                    <span className="text-yellow-700">
                      Present in: {presentIn.join(', ')} | Absent in: {absentIn.join(', ')}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-green-50 border-l-4 border-green-400 p-4 mb-6">
              <div className="flex items-center gap-2">
                <Icon name="check-circle" size={20} className="text-green-600" />
                <h4 className="font-semibold text-green-800">HLA Alleles Consistent Across Groups</h4>
              </div>
              <p className="text-sm text-green-700 mt-1">
                All {analysis.consistent.length} alleles are present in both groups. No evidence of LOH.
              </p>
            </div>
          )}

          {/* Allele comparison table */}
          <div className="bg-gray-50 rounded-lg p-4">
            <h4 className="text-sm font-semibold text-gray-700 mb-3">Allele Presence by Group</h4>
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-gray-300">
                  <th className="text-left py-2">Allele</th>
                  {groups.map(g => (
                    <th key={g} className="text-center py-2">{g}</th>
                  ))}
                  <th className="text-left py-2">Status</th>
                </tr>
              </thead>
              <tbody>
                {[...analysis.consistent, ...analysis.potentialLOH].map(item => {
                  const allele = item.allele;
                  const isLOH = item.absentIn !== undefined;
                  return (
                    <tr key={allele} className={`border-b border-gray-200 ${isLOH ? 'bg-yellow-50' : ''}`}>
                      <td className="py-2 font-mono text-xs">{allele}</td>
                      {groups.map(g => (
                        <td key={g} className="py-2 text-center">
                          {analysis.allelesByGroup[g].has(allele) ? (
                            <span className="text-green-600 font-bold">&#10003;</span>
                          ) : (
                            <span className="text-red-600 font-bold">&#10007;</span>
                          )}
                        </td>
                      ))}
                      <td className="py-2">
                        {isLOH ? (
                          <span className="text-xs px-2 py-0.5 bg-yellow-200 text-yellow-800 rounded">Potential LOH</span>
                        ) : (
                          <span className="text-xs px-2 py-0.5 bg-green-200 text-green-800 rounded">Consistent</span>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // pMHC Cards Component
    const PMHCCards = ({ data, sortMetric, comments, setComments, selectedRow, setSelectedRow, hasCustomFormula, tumorType, tumorSubtype, multiAllelePeptides, groupedData, sectionConfig }) => {
      const displayGroups = groupedData || data.map(row => ({ key: `${row.peptide}-${row.allele}`, isDuplicate: false, rows: [row], avgRow: row }));
      return (
      <div className="mt-4">
        <h3 className="text-base font-semibold text-gray-800 mb-4">Top {data.length} pMHCs</h3>
        <div className="grid gap-3">
          {displayGroups.map((group, idx) => (
            <PMHCCard key={`${group.key}-${idx}`} row={group.avgRow} idx={idx} sortMetric={sortMetric} comments={comments} setComments={setComments} isSelected={selectedRow?.peptide === group.avgRow.peptide && selectedRow?.allele === group.avgRow.allele} onSelect={() => setSelectedRow(group.avgRow)} hasCustomFormula={hasCustomFormula} tumorType={tumorType} tumorSubtype={tumorSubtype} hasMultiAllele={multiAllelePeptides && multiAllelePeptides.has(group.avgRow.peptide)} group={group} sectionConfig={sectionConfig} />
          ))}
        </div>
      </div>
    ); };

    const parseJsonField = (value) => {
      if (!value) return null;
      if (typeof value === 'object') return value;
      try {
        return JSON.parse(value);
      } catch (err) {
        return null;
      }
    };

    const formatList = (value) => {
      if (!value) return 'N/A';
      if (Array.isArray(value)) return value.join(', ');
      return String(value);
    };

    // HPA Tissue Expression Bar Chart (D3)
    const HPABarChart = ({ tissues, sectionConfig }) => {
      const svgRef = React.useRef(null);
      const hpaConfig = sectionConfig?.hpa_chart_config || {};
      const reproTissues = new Set(hpaConfig.highlight_tissues || ['testis', 'ovary', 'placenta', 'endometrium', 'fallopian tube', 'seminal vesicle', 'epididymis', 'prostate']);
      const highlightColor = hpaConfig.highlight_color || '#7c3aed';
      const defaultColor = hpaConfig.default_color || '#6366f1';

      React.useEffect(() => {
        if (!svgRef.current || !tissues?.length) return;
        const data = tissues.slice(0, 15);
        const margin = { top: 5, right: 30, bottom: 20, left: 120 };
        const width = 400 - margin.left - margin.right;
        const height = data.length * 20;

        const svg = d3.select(svgRef.current);
        svg.selectAll('*').remove();
        svg.attr('width', width + margin.left + margin.right)
           .attr('height', height + margin.top + margin.bottom);

        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const x = d3.scaleLinear().domain([0, d3.max(data, d => d.tpm) || 1]).range([0, width]);
        const y = d3.scaleBand().domain(data.map(d => d.tissue)).range([0, height]).padding(0.2);

        g.selectAll('.bar').data(data).join('rect')
          .attr('class', 'bar')
          .attr('x', 0).attr('y', d => y(d.tissue))
          .attr('width', d => x(d.tpm)).attr('height', y.bandwidth())
          .attr('fill', d => reproTissues.has(d.tissue.toLowerCase()) ? highlightColor : defaultColor)
          .attr('rx', 2);

        g.selectAll('.label').data(data).join('text')
          .attr('x', d => x(d.tpm) + 3).attr('y', d => y(d.tissue) + y.bandwidth() / 2)
          .attr('dy', '0.35em').attr('font-size', '10px').attr('fill', '#4b5563')
          .text(d => d.tpm.toFixed(1));

        g.append('g').selectAll('.tissue').data(data).join('text')
          .attr('x', -4).attr('y', d => y(d.tissue) + y.bandwidth() / 2)
          .attr('dy', '0.35em').attr('text-anchor', 'end').attr('font-size', '10px')
          .attr('fill', d => reproTissues.has(d.tissue.toLowerCase()) ? highlightColor : '#374151')
          .attr('font-weight', d => reproTissues.has(d.tissue.toLowerCase()) ? '600' : '400')
          .text(d => d.tissue.length > 18 ? d.tissue.slice(0, 16) + '...' : d.tissue);

        g.append('g').attr('transform', `translate(0,${height})`).call(d3.axisBottom(x).ticks(4).tickSize(3))
          .selectAll('text').attr('font-size', '9px');
      }, [tissues, sectionConfig]);

      if (!tissues?.length) return <div className="text-xs text-gray-400 italic">No tissue data available</div>;
      return (
        <div>
          <div className="text-xs font-medium text-gray-600 mb-1">{hpaConfig.title || 'RNA Tissue Expression (nTPM)'}</div>
          <svg ref={svgRef}></svg>
          <div className="flex gap-3 mt-1 text-xs text-gray-400">
            <span><span className="inline-block w-2 h-2 rounded-sm mr-0.5" style={{backgroundColor: highlightColor}}></span> Highlighted</span>
            <span><span className="inline-block w-2 h-2 rounded-sm mr-0.5" style={{backgroundColor: defaultColor}}></span> Other</span>
          </div>
        </div>
      );
    };

    // ClinVar Summary Component
    const ClinVarSummary = ({ data, sectionConfig }) => {
      if (!data?.results?.length) return <div className="text-xs text-gray-400 italic">No ClinVar entries found</div>;
      const sigColors = sectionConfig?.clinvar_significance_colors || {};
      return (
        <div>
          <div className="text-xs font-medium text-gray-600 mb-1">ClinVar Annotations</div>
          <div className="space-y-1.5">
            {data.results.slice(0, 3).map((r, i) => {
              const colorConf = sigColors[r.clinical_significance?.toLowerCase()] || {};
              const colorClass = colorConf.bg && colorConf.text ? `${colorConf.bg} ${colorConf.text}` : 'bg-gray-100 text-gray-600';
              return (
              <div key={i} className="flex flex-wrap items-center gap-1.5 text-xs">
                <span className={`px-1.5 py-0.5 rounded font-medium ${colorClass}`}>
                  {r.clinical_significance || 'Unknown'}
                </span>
                {r.accession && <a href={`https://www.ncbi.nlm.nih.gov/clinvar/variation/${r.accession}/`} target="_blank" rel="noopener" className="text-blue-600 hover:underline" onClick={e => e.stopPropagation()}>{r.accession}</a>}
                {r.conditions?.length > 0 && <span className="text-gray-500">{r.conditions.join(', ')}</span>}
              </div>
              );
            })}
          </div>
        </div>
      );
    };

    // Reference Links Component
    const ReferenceLinks = ({ data }) => {
      if (!data?.links?.length) return null;
      return (
        <div>
          <div className="text-xs font-medium text-gray-600 mb-1">External References</div>
          <div className="flex flex-wrap gap-1.5">
            {data.links.map((link, i) => (
              <a key={i} href={link.url} target="_blank" rel="noopener"
                onClick={e => e.stopPropagation()}
                className="inline-block px-2 py-0.5 text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full transition">
                {link.name} <Icon name="external-link" size={10} className="inline ml-0.5" />
              </a>
            ))}
          </div>
        </div>
      );
    };

    // Expanded Card Content — fetches external data and shows source details
    const ExpandedCardContent = ({ row, sectionConfig }) => {
      const [apiResults, setApiResults] = useState({});
      const [loading, setLoading] = useState(true);
      const expandedConfig = sectionConfig.expanded_content || {};
      const apis = expandedConfig.apis || [];
      const referenceLinks = expandedConfig.reference_links !== false;

      React.useEffect(() => {
        let cancelled = false;
        const gene = row.cta_gene || row.gene_name || '';
        const source = row.antigen_source || '';
        const fetches = [];

        // Config-driven API routing
        for (const api of apis) {
          const sourceFilter = api.source_filter;
          if (sourceFilter && !sourceFilter.some(f => source.toLowerCase().includes(f.toLowerCase()))) continue;
          const params = Array.isArray(api.params) ? api.params : [];
          const urlParams = new URLSearchParams();
          for (const p of params) {
            // Resolve field value with || fallback (e.g., "cta_gene||gene_name")
            const fieldParts = (p.field || '').split('||');
            let resolved = '';
            for (const part of fieldParts) {
              resolved = row[part.trim()];
              if (resolved !== undefined && resolved !== null && resolved !== '') break;
            }
            if (resolved) urlParams.set(p.param, resolved);
          }
          const url = api.endpoint + (urlParams.toString() ? '?' + urlParams.toString() : '');
          fetches.push(
            fetch(url)
              .then(r => r.json())
              .then(d => { if (!cancelled) setApiResults(prev => ({ ...prev, [api.component]: d })); })
              .catch(() => {})
          );
        }

        // Reference links for all (unless disabled)
        if (referenceLinks && gene) {
          fetches.push(
            fetch(`/api/external/links?gene=${encodeURIComponent(gene)}&source=${encodeURIComponent(source)}`)
              .then(r => r.json()).then(d => { if (!cancelled) setApiResults(prev => ({ ...prev, _links: d })); })
              .catch(() => {})
          );
        }

        Promise.allSettled(fetches).then(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [row]);

      return (
        <div className="mb-3 p-3 bg-blue-50 rounded-md border border-blue-100 space-y-3" onClick={e => e.stopPropagation()}>
          <div className="text-xs font-semibold text-blue-800 uppercase tracking-wide">Detailed Information</div>
          {loading && <div className="flex items-center gap-2 text-xs text-gray-500"><Icon name="loader-2" size={12} className="animate-spin" /> Loading external data...</div>}
          {apis.map(api => {
            const data = apiResults[api.component];
            if (!data) return null;
            if (api.component === 'hpa_tissue_chart' || api.component === 'hpa') return <HPABarChart key={api.component} tissues={data.tissues} sectionConfig={sectionConfig} />;
            if (api.component === 'clinvar_summary' || api.component === 'clinvar') return <ClinVarSummary key={api.component} data={data} sectionConfig={sectionConfig} />;
            // Generic fallback for unknown components
            return <div key={api.component} className="text-xs text-gray-600">{JSON.stringify(data)}</div>;
          })}
          {apiResults._links && <ReferenceLinks data={apiResults._links} />}
          {!loading && Object.keys(apiResults).length === 0 && (
            <div className="text-xs text-gray-400 italic">No external data available for this entry.</div>
          )}
        </div>
      );
    };

    // pMHC Card Component
    const PMHCCard = ({ row, idx, sortMetric, comments, setComments, isSelected, onSelect, hasCustomFormula, tumorType, tumorSubtype, hasMultiAllele, group, sectionConfig }) => {
      const key = `${row.peptide}-${row.allele}`;
      const [showOrigins, setShowOrigins] = useState(false);
      const isDuplicate = group && group.isDuplicate;
      const [expanded, setExpanded] = useState(false);
      const sourceFields = (sectionConfig.source_fields || {})[row.antigen_source] || [];
      const antigenSource = (row.antigen_source || '').toLowerCase();
      const isSNV = antigenSource.includes('snv');
      const isIndel = antigenSource.includes('indel');
      const isFusion = antigenSource.includes('fusion');
      const isCTA = antigenSource.includes('cta');
      const snvEvidence = parseJsonField(row.snv_external_evidence);
      const fusionEvidence = parseJsonField(row.fusion_evidence);
      const ctaExpression = parseJsonField(row.cta_hpa_expression);
      const fusionContext = (() => {
        if (!fusionEvidence) return null;
        const tumorData = fusionEvidence[tumorType];
        if (!tumorData) return null;
        const subtypeData = tumorSubtype && tumorData.subtypes ? tumorData.subtypes[tumorSubtype] : null;
        return { tumorData, subtypeData };
      })();

      return (
        <div onClick={onSelect} className={`bg-white rounded-lg p-4 cursor-pointer transition shadow-sm hover:shadow-md ${isSelected ? 'border-2 border-indigo-500 bg-indigo-50' : 'border border-gray-200'}`}>
          <div className="flex justify-between items-start mb-3">
            <div>
              <div className="text-lg font-bold text-gray-800 mb-0.5 font-mono">{row.peptide}</div>
              <div className="text-sm text-gray-500 font-mono">{row.allele} &bull;{' '}
                {(() => {
                  const badge = (sectionConfig.source_badges || {})[row.antigen_source] || (sectionConfig.source_badges || {})._default || {bg: 'bg-gray-100', text: 'text-gray-600'};
                  return <span className={`inline-block px-1.5 py-0.5 rounded text-xs font-medium ${badge.bg} ${badge.text}`}>{row.antigen_source}</span>;
                })()}
                {isDuplicate && (
                  <span className="inline-block px-1.5 py-0.5 rounded text-xs font-medium bg-rose-100 text-rose-700 ml-1">Multiple Genomic Origins</span>
                )}
                {hasMultiAllele && (
                  <span className="inline-block px-1.5 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-700 ml-1">Multiple HLA Alleles</span>
                )}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={(e) => { e.stopPropagation(); setExpanded(!expanded); }}
                className="text-gray-400 hover:text-gray-600 p-1" title={expanded ? 'Collapse' : 'Expand details'}>
                <Icon name={expanded ? 'chevron-up' : 'chevron-down'} size={16} />
              </button>
              <div className="bg-indigo-600 text-white px-3 py-1 rounded-full text-sm font-bold">#{idx + 1}</div>
            </div>
          </div>

          <div className="mb-3 p-3 bg-gray-50 rounded-md">
            <table className="w-full"><tbody>
              {(() => {
                const metrics = sectionConfig.card_metrics || [];
                if (metrics.length === 0) return null;
                return metrics.map((m, mi) => {
                  if (m._section) {
                    const conds = (m.condition || '').split('||');
                    if (!conds.some(c => row[c.trim()])) return null;
                    return <tr key={`section-${mi}`}><td colSpan={2} className="pt-1 pb-0.5">
                      <div className="border-t border-gray-200 mt-1 mb-0.5"></div>
                      <div className="text-xs font-medium text-gray-400 mt-0.5">{m._section}</div>
                    </td></tr>;
                  }
                  if (m.condition) {
                    const conds = m.condition.split('||');
                    if (!conds.some(c => row[c.trim()])) return null;
                  }
                  let resolvedKey = m.key;
                  if (resolvedKey === '{sortMetric}') resolvedKey = sortMetric;
                  let value;
                  if (resolvedKey.includes('||')) {
                    const parts = resolvedKey.split('||');
                    value = parts.map(p => row[p.trim()]).find(v => v !== undefined && v !== null && v !== '') || row[parts[0].trim()];
                  } else if (resolvedKey.includes('/')) {
                    const parts = resolvedKey.split('/');
                    value = parts.map(p => row[p.trim()] != null ? row[p.trim()] : '').join('/');
                  } else {
                    value = row[resolvedKey];
                  }
                  if (value === undefined || value === null || value === '') return null;
                  return <MetricDisplay key={mi} label={m.label} value={value} isText={m.isText} highlight={m.highlight} tooltip={m.tooltip} />;
                });
              })()}
            </tbody></table>
          </div>

          {(() => {
            const detailSections = sectionConfig.source_detail_sections || {};
            const applicableSections = Object.entries(detailSections).filter(([_, sec]) => {
              const appliesTo = sec.applies_to || [_.toLowerCase()];
              return appliesTo.some(s => antigenSource.includes(s.toLowerCase()));
            });
            if (applicableSections.length === 0) return null;
            return (
            <div className="grid gap-3 mb-3">
              {applicableSections.map(([sectionKey, secConf]) => {
                // Built-in rendering for known section types
                if (sectionKey === 'SNV' || sectionKey === 'Indel') {
                  return (isSNV || isIndel) && (
                    <div key={sectionKey} className="rounded-md border border-gray-200 bg-white p-3">
                      <div className="text-sm font-semibold text-gray-800 mb-1">{secConf.title || 'Genomic Context'}</div>
                      <div className="text-xs text-gray-600 mb-1">
                        {(row.chromosome || 'chr?') + ':' + (row.start || 'N/A') + '-' + (row.end || 'N/A')} &bull; {(row.ref || '?')}→{(row.alt || '?')}
                      </div>
                      <div className="text-xs text-gray-500">{row.gene_name || 'Unknown gene'} &bull; {row.protein_change || 'N/A'} &bull; {row.variant_type || 'variant'}</div>
                      <div className="mt-2 pt-2 border-t border-dashed border-gray-200 text-xs text-gray-600 space-y-0.5">
                        <div className="font-semibold text-gray-700">External Variant Evidence (Open Sources)</div>
                        {snvEvidence ? (
                          <>
                            <div><span className="font-medium">Sources:</span> {formatList(snvEvidence.sources)}</div>
                            <div><span className="font-medium">Tier:</span> {snvEvidence.tier || 'N/A'}</div>
                            <div><span className="font-medium">Occurrences:</span> {snvEvidence.occurrences || 'N/A'}</div>
                            <div><span className="font-medium">Summary:</span> {snvEvidence.summary || 'N/A'}</div>
                            {snvEvidence.notes && <div><span className="font-medium">Notes:</span> {snvEvidence.notes}</div>}
                          </>
                        ) : (
                          <div>No external evidence provided.</div>
                        )}
                      </div>
                    </div>
                  );
                }
                if (sectionKey === 'Fusion') {
                  return isFusion && (
                    <div key={sectionKey} className="rounded-md border border-gray-200 bg-white p-3">
                      <div className="text-sm font-semibold text-gray-800 mb-1">{secConf.title || 'Fusion Evidence'}</div>
                      <div className="text-xs text-gray-600 mb-1">
                        {row.fusion_partner_5 || 'Gene5'} &mdash; {row.fusion_partner_3 || 'Gene3'} &bull; {row.fusion_type || 'fusion'}
                      </div>
                      <div className="text-xs text-gray-500 mb-2">Junction: {row.fusion_junction || 'N/A'} &bull; Support reads: {row.fusion_support_reads || 'N/A'}</div>
                      <div className="text-xs text-gray-600 space-y-0.5">
                        <div><span className="font-medium">Tumor:</span> {tumorType}{tumorSubtype ? ` (${tumorSubtype})` : ''}</div>
                        {fusionContext ? (
                          <>
                            <div><span className="font-medium">Sources:</span> {formatList(fusionContext.tumorData.sources)}</div>
                            <div><span className="font-medium">Samples:</span> {fusionContext.tumorData.samples || 'N/A'}</div>
                            {fusionContext.subtypeData && (
                              <div><span className="font-medium">Subtype samples:</span> {fusionContext.subtypeData.samples || 'N/A'}</div>
                            )}
                            {fusionContext.tumorData.notes && <div><span className="font-medium">Notes:</span> {fusionContext.tumorData.notes}</div>}
                          </>
                        ) : (
                          <div>No fusion evidence available for selected tumor type.</div>
                        )}
                      </div>
                    </div>
                  );
                }
                if (sectionKey === 'CTA') {
                  return isCTA && (
                    <div key={sectionKey} className="rounded-md border border-gray-200 bg-white p-3">
                      <div className="text-sm font-semibold text-gray-800 mb-1">{secConf.title || 'CTA Expression (Human Protein Atlas)'}</div>
                      <div className="text-xs text-gray-600 mb-1">{row.cta_gene || row.gene_name || 'CTA'} &bull; {row.cta_tissue_specificity || 'tissue-specific'}</div>
                      {ctaExpression ? (
                        <div className="text-xs text-gray-600 space-y-0.5">
                          <div><span className="font-medium">Group:</span> {ctaExpression.group || 'N/A'}</div>
                          <div><span className="font-medium">Median TPM:</span> {ctaExpression.median_tpm || 'N/A'}</div>
                          <div><span className="font-medium">TPM Range:</span> {ctaExpression.tpm_range || 'N/A'}</div>
                          <div><span className="font-medium">Enriched Tissues:</span> {formatList(ctaExpression.enriched_tissues)}</div>
                          {ctaExpression.source && <div><span className="font-medium">Source:</span> {ctaExpression.source}</div>}
                        </div>
                      ) : (
                        <div className="text-xs text-gray-600">No CTA expression distribution available.</div>
                      )}
                    </div>
                  );
                }
                // Generic renderer for unknown section types
                const fields = secConf.fields || [];
                const evidenceField = secConf.evidence_field;
                const evidenceData = evidenceField ? parseJsonField(row[evidenceField]) : null;
                return (
                  <div key={sectionKey} className="rounded-md border border-gray-200 bg-white p-3">
                    <div className="text-sm font-semibold text-gray-800 mb-1">{secConf.title || sectionKey}</div>
                    {secConf.sublabel_template && (
                      <div className="text-xs text-gray-600 mb-1">
                        {secConf.sublabel_template.replace(/\{(\w+)\}/g, (_, k) => row[k] || 'N/A')}
                      </div>
                    )}
                    {secConf.context_template && (
                      <div className="text-xs text-gray-500 mb-2">
                        {secConf.context_template.replace(/\{(\w+)\}/g, (_, k) => row[k] || 'N/A')}
                      </div>
                    )}
                    {fields.length > 0 && (
                      <div className="text-xs text-gray-600 space-y-0.5">
                        {fields.map(f => (
                          <div key={f.key}><span className="font-medium">{f.label}:</span> {row[f.key] || 'N/A'}</div>
                        ))}
                      </div>
                    )}
                    {evidenceData && (
                      <div className="mt-2 pt-2 border-t border-dashed border-gray-200 text-xs text-gray-600 space-y-0.5">
                        {Object.entries(evidenceData).map(([k, v]) => (
                          <div key={k}><span className="font-medium">{k}:</span> {Array.isArray(v) ? v.join(', ') : String(v)}</div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            );
          })()}

          {expanded && <ExpandedCardContent row={row} sectionConfig={sectionConfig} />}

          {isDuplicate && (
            <div className="mb-3">
              <button
                onClick={(e) => { e.stopPropagation(); setShowOrigins(!showOrigins); }}
                className="flex items-center gap-1.5 text-xs font-medium text-rose-700 hover:text-rose-900 cursor-pointer"
              >
                <Icon name={showOrigins ? 'chevron-up' : 'chevron-down'} size={14} />
                {showOrigins ? 'Hide' : 'Show'} {group.rows.length} Genomic Origins (showing averages above)
              </button>
              {showOrigins && (
                <div className="mt-2 space-y-2">
                  {group.rows.map((origin, oi) => (
                    <div key={oi} className="border border-gray-200 rounded-md p-2.5 bg-gray-50">
                      <div className="flex items-center gap-1.5 mb-1.5">
                        {(() => {
                          const badge = (sectionConfig.source_badges || {})[origin.antigen_source] || (sectionConfig.source_badges || {})._default || {bg: 'bg-gray-100', text: 'text-gray-600'};
