                          return <span className={`inline-block px-1.5 py-0.5 rounded text-xs font-medium ${badge.bg} ${badge.text}`}>{origin.antigen_source}</span>;
                        })()}
                        {origin.transcript_id && <span className="text-xs text-gray-500 font-mono">{origin.transcript_id}</span>}
                        {origin.gene_name && <span className="text-xs text-gray-500">&bull; {origin.gene_name}</span>}
                      </div>
                      <div className="grid grid-cols-3 gap-x-3 gap-y-0.5 text-xs">
                        {(sectionConfig.origin_detail_metrics || []).map(m => {
                          let resolvedKey = m.key === '{sortMetric}' ? sortMetric : m.key;
                          const val = origin[resolvedKey];
                          return val != null && val !== '' ? <div key={m.key}><span className="text-gray-500">{m.label}:</span> <span className="font-medium">{m.isText ? String(val) : (parseFloat(val) || 0).toFixed(3)}</span></div> : null;
                        })}
                        {origin.fusion_support_reads && <div><span className="text-gray-500">Support Reads:</span> <span className="font-medium">{origin.fusion_support_reads}</span></div>}
                        {origin.splice_type && <div><span className="text-gray-500">Splice Type:</span> <span className="font-medium">{origin.splice_type}</span></div>}
                        {origin.cta_transcript && <div><span className="text-gray-500">CTA Transcript:</span> <span className="font-medium">{origin.cta_transcript}</span></div>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <div>
            <label className="block mb-1 text-xs font-medium text-gray-700">Comments</label>
            <textarea
              value={comments[key] || ''} onChange={(e) => { e.stopPropagation(); setComments({ ...comments, [key]: e.target.value }); }} onClick={(e) => e.stopPropagation()}
              placeholder="Add your notes about this pMHC..."
              className="w-full min-h-14 px-3 py-2 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-y"
            />
          </div>
        </div>
      );
    };

    // Metric Display Component — renders a table row (key left, value right)
    const MetricDisplay = ({ label, value, highlight, transform, isText, tooltip }) => {
      const displayValue = (v) => {
        if (v === null || v === undefined || v === '' || v === 'NA') return 'N/A';
        if (isText) return String(v);
        const transformedValue = transform ? transform(v) : parseFloat(v);
        if (transformedValue === null || isNaN(transformedValue)) return 'N/A';
        if (Number.isInteger(transformedValue)) return String(transformedValue);
        return transformedValue.toFixed(3);
      };
      return (
        <tr className={highlight ? 'bg-indigo-50' : ''}>
          <td className={`pr-3 py-0.5 text-xs uppercase tracking-wide whitespace-nowrap ${highlight ? 'text-indigo-700 font-semibold' : 'text-gray-500'}`} title={tooltip || ''}>{label}{tooltip ? ' ℹ' : ''}</td>
          <td className={`py-0.5 text-sm font-semibold ${highlight ? 'text-indigo-900' : 'text-gray-800'}`}>{displayValue(value)}</td>
        </tr>
      );
    };

    // Render
    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<LENSViewer />);
    } catch (error) {
      console.error('Failed to render RAFT Viewer:', error);
      document.getElementById('root').innerHTML =
        '<div class="p-8 font-sans max-w-xl">' +
        '<h2 class="text-red-600 text-xl font-bold mb-4">Application Error</h2>' +
        '<p class="mb-2">Failed to initialize the RAFT Viewer.</p>' +
        '<pre class="bg-gray-100 p-4 rounded text-xs overflow-auto">' + error.toString() + '</pre>' +
        '<p class="mt-4"><a href="javascript:location.reload()" class="text-blue-600 hover:underline">Click here to retry</a></p>' +
        '</div>';
    }
  </script>
  <script>
    (function () {
      const sourceEl = document.getElementById('raft-viewer-source');
      if (!sourceEl) return;
      try {
        const result = Babel.transform(sourceEl.textContent, {
          presets: [['react', { runtime: 'classic' }]]
        });
        window.eval(result.code + '\n//# sourceURL=raft-viewer-compiled.js');
      } catch (error) {
        const details = [
          error && error.message ? error.message : String(error || 'Unknown Babel error'),
          error && error.codeFrame ? error.codeFrame : '',
          error && error.loc ? `Line ${error.loc.line}, column ${error.loc.column}` : ''
        ].filter(Boolean).join('\n\n');
        window.__RAFT_VIEWER_BOOT_ERRORS__.push(details);
        window.__RAFT_VIEWER_SHOW_BOOT_ERRORS__();
      }
    })();
  </script>
</body>
</html>
